/* Layout: phone-first app shell — sticky date header, one scrolling view per tab, fixed bottom tab bar.

:root{

  --prot:#C93434; --carb:#1E5BCB; --fat:#C99207; --kcal:#1C8447; --on-ink:#FFFFFF;

  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1115; --surface:#171B21; --surface-2:#222831; --ink:#ECEFF3; --muted:#99A2AE; --line:#2B313A;
  --prot:#F0625E; --carb:#6593F2; --fat:#F0C23F; --kcal:#3FBE73; --on-ink:#0E1115; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1115; --surface:#171B21; --surface-2:#222831; --ink:#ECEFF3; --muted:#99A2AE; --line:#2B313A;
  --prot:#F0625E; --carb:#6593F2; --fat:#F0C23F; --kcal:#3FBE73; --on-ink:#0E1115; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--carb);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}

.datenav .d small{display:block;font-weight:500;font-size:11px;color:var(--muted)}

main{display:grid;gap:14px;padding-top:14px}

h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
p{margin:0}

.row{display:flex;align-items:center;gap:10px;min-width:0}

label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}

/* today hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:30px;line-height:1}
.ring .c span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.macros{display:grid;gap:9px;min-width:0}
.mac{display:grid;gap:4px}
.mac .row{font-size:13px}
.mac .row b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.plate{width:10px;height:10px;border-radius:50%;flex:none}

.water{display:flex;flex-wrap:wrap;gap:6px}
.water button{width:30px;height:38px;border-radius:7px 7px 10px 10px;border:1.5px solid var(--carb);background:transparent;padding:0}

.list{display:grid;gap:0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}

.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}

.check.on::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}

.tabs-inline{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.ex .meta{font-size:12.5px;color:var(--muted)}
.sets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.set{min-width:38px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;padding:0 8px}
.set.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.kg{width:86px!important;padding:7px 9px!important;text-align:center}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lift{width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 84px;gap:10px;align-items:center}
.lift:first-child{border-top:0}
.lift b{font-weight:600;display:block}
.lift small{font-size:12px;color:var(--muted)}
.lift .v{text-align:right;font-weight:700;white-space:nowrap}
.lift .v small{display:block;font-weight:500}
.hist{display:grid;gap:4px;font-size:13px;padding:0 0 10px}

.week button b{font-size:12px}
.week button span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.week button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.week button.on span{color:inherit;opacity:.75}
.week button.today{box-shadow:inset 0 -3px 0 var(--carb)}

/* demos & videos */
.demo{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:10px;overflow:hidden;background:#101317}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img+img{animation:flip 1.8s linear infinite}
@keyframes flip{0%,48%{opacity:0}52%,96%{opacity:1}100%{opacity:0}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vitem{display:grid;gap:6px;align-content:start;min-width:0}
.vitem b{font-weight:600;font-size:14px;line-height:1.25}
.vitem small{font-size:12px;color:var(--muted)}
.vlink{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--carb);text-decoration:none;padding:4px 0}
.vlink svg{width:16px;height:16px;flex:none}
.noimg{aspect-ratio:3/2;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600;text-align:center;padding:8px}
.demo-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;font-weight:600;padding:3px 8px;flex:none}

/* photos, measurements, timer */
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ptile{position:relative;display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.ptile img,.padd{width:100%;aspect-ratio:3/4;border-radius:10px;object-fit:cover;display:grid;place-items:center}
.padd{border:1.5px dashed var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.pdel{position:absolute;top:4px;right:4px;background:rgb(0 0 0 / .55);color:#fff;border-radius:8px;width:28px;height:28px;padding:0}
.pcmp{margin:0;display:grid;gap:4px;min-width:0}
.pcmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.pcmp figcaption{font-size:12px;font-weight:600;text-align:center}
.pthumbs{display:flex;gap:4px}
.pthumbs img{width:34px;height:44px;object-fit:cover;border-radius:6px}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px 6px 0}
.mtable td{padding:8px 8px 8px 0;border-top:1px solid var(--line)}
.timer{position:fixed;z-index:26;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--ink);color:var(--on-ink);border-radius:16px;padding:10px 10px 14px 14px;display:flex;align-items:center;gap:8px;overflow:hidden;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.timer.go{background:var(--kcal);color:#fff}
.timer .tl{flex:1;min-width:0;display:grid}
.timer .tl b{font-family:var(--display);font-size:30px;line-height:1}
.timer .tl small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;border-radius:10px;background:rgb(255 255 255 / .16);color:inherit;font-weight:700;font-size:13px;padding:9px 10px}
.timer i{position:absolute;left:0;bottom:0;height:4px;background:var(--fat)}
body.timing .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}

.qa-b small{font-size:11.5px;color:var(--muted)}
.scanv{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#000}
.aiimg{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.btn[disabled]{opacity:.45}

.qty input{width:80px!important;text-align:center}

/* progress */
.chart{width:100%;height:auto;display:block}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.callout{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:5px}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

nav.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;min-width:0}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button.on{color:var(--ink)}
.sync{font-size:11px;color:var(--muted);text-align:center;padding-top:4px}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.macros{width:100%}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.demo img+img{animation:none;opacity:0}}
</style>

}

  const local=lsGet(k);
  if(!Cloud.ready)return local;
  try{
    const snap=await ref(k).get();
    if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()));lsSet(k,d);return d}
    if(local)save(k,local);
    return local;
  }catch(e){return local}
}
function save(k,v){
  latest[k]=v;lsSet(k,v);
  if(!Cloud.ready)return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    chains[k]=(chains[k]||Promise.resolve()).then(()=>ref(k).set(latest[k])).then(()=>{Cloud.err=false;renderSync()}).catch(()=>{Cloud.err=true;renderSync()});
  },700);
}

/* ---------- next-weight coach (double progression) ---------- */
const SMALL_LIFTS=new Set(['latr','latr2','fpull','curl','hammer','incurl','kitty','push','pdeck','lext','slext','slcurl','llcurl','abduct','scalf','lpcalf','neck','pallof','sllp','jmp','dips']);
function repRange(r){const m=String(r).match(/(\d+)(?:–(\d+))?/);return m?{lo:+m[1],hi:+(m[2]||m[1])}:null}
function lastLift(id,date){const h=(S.profile.liftLog||{})[id]||{};const d=Object.keys(h).filter(x=>x<date).sort().pop();return d?{...h[d],date:d}:null}
function nextTarget(e,date){
  const last=lastLift(e.id,date),rr=repRange(e.r);if(!last||!rr)return null;
  const inc=SMALL_LIFTS.has(e.id)?1:2.5;
  if(last.reps&&last.reps>=rr.hi)return{kg:r1(last.kg+inc),why:`You hit ${last.reps} reps last time. Go up ${inc} kg.`,up:true};
  if(last.reps&&last.reps<rr.lo)return{kg:last.kg,why:`Stay here until you get ${rr.lo}+ reps.`};
  return{kg:last.kg,why:last.reps?`Same weight, beat ${last.reps} reps.`:'Same weight. Log reps so the coach can move you up.'};
}

/* ---------- protein helper ---------- */
const PROT_OPTS=[['whey',1],['gyog',2],['tuna',1],['chicken',1.5],['cottage',2],['egg',3],['casein',1],['protbar',1],['laban',1]];
function proteinIdeas(need){
  const night=new Date().getHours()>=21,opts=PROT_OPTS.filter(([id])=>night?id!=='protbar':id!=='casein'),combos=[];
  opts.forEach((a,i)=>{combos.push([a]);opts.slice(i+1).forEach(b=>combos.push([a,b]))});
  return combos.map(c=>({c,s:sumItems(c)})).filter(x=>x.s.p>=need*0.85&&x.s.p<=need+25)
    .sort((x,y)=>(Math.abs(x.s.p-need)+x.c.length*6+x.s.k/60)-(Math.abs(y.s.p-need)+y.c.length*6+y.s.k/60)).slice(0,3);
}
function viewProteinHelper(){
  if(S.date!==TODAY)return '';
  const need=r0(targets(S.date).p-totals(S.day.foods).p),h=new Date().getHours();
  if(need<15||(need>80&&h<17))return '';
  const label=([id,q])=>{const f=foodById(id),a=amtInfo(f);return a?`${r0(q*a.base)} ${a.unit} ${f.n.replace(/ \(.*\)/,'').toLowerCase()}`:`${qtyLabel(q)} ${f.u.replace(/^1 /,'')} ${f.n.replace(/ \(.*\)/,'').toLowerCase()}`.replace(/^(\d+) (\w+) \2/,'$1 $2')};
  const ideas=need<=80?proteinIdeas(need):[];
  return `<section class="card"><div class="row between"><h3>Protein: ${need} g to go</h3><span class="chip warn">helper</span></div>
    ${ideas.length?`<div class="list">${ideas.map(x=>`<div class="li"><div class="t"><b>${x.c.map(label).map(esc).join(' + ')}</b><small class="num">${r0(x.s.p)} g protein · ${r0(x.s.k)} kcal</small></div><button class="btn ghost sm" data-a="logIdea" data-v="${x.c.map(([id,q])=>id+':'+q).join(',')}">Log</button></div>`).join('')}</div>`
    :`<p style="font-size:13.5px">That's a big gap. Log the meals from your plan first (Food tab), then check back here.</p>`}
  </section>`;
}

/* ---------- day cache, streaks and the cycle report ---------- */
async function getDay(d){if(d===S.date)return S.day;if(!S.dayCache[d])S.dayCache[d]=Object.assign(blankDay(),await load(dayKey(d))||{});return S.dayCache[d]}
const CHECKS={
  protein:(d,day)=>totals(day.foods).p>=targets(d).p*0.9,
  water:(d,day)=>(day.water||0)>=13,
  train:(d,day)=>{if(dayPlan(d).type!=='train')return true;const wp=workoutProgress(d,day);return wp.total>0&&wp.done>=wp.total*0.5},
};
async function computeStreaks(){
  if(TODAY<START){S.streaks=null;return}
  const res={},tday=await getDay(TODAY);
  for(const k of Object.keys(CHECKS)){
    let n=0,d=addDays(TODAY,-1);
    while(d>=START&&n<400){if(!CHECKS[k](d,await getDay(d)))break;n++;d=addDays(d,-1)}
    const t=CHECKS[k](TODAY,tday);res[k]={n:n+(t?1:0),today:t};
  }
  S.streaks=res;
}
let streakT;
function scheduleStreaks(){clearTimeout(streakT);streakT=setTimeout(async()=>{await computeStreaks();if(S.tab==='today'&&!S.sheet)render()},400)}
function viewStreaks(){
  if(S.date!==TODAY||!S.streaks)return '';
  const tile=(k,n)=>{const s=S.streaks[k];return `<div class="streak ${s.today?'done':''}"><b class="num">${s.n}</b><span>${n}</span><small>${s.today?'today done':'today to do'}</small></div>`};
  return `<section class="streaks" aria-label="Streaks in days">${tile('protein','Protein days')}${tile('train','Training on plan')}${tile('water','Water days')}</section>`;
}
const cycleStartOf=d=>d<START?START:addDays(d,-cycleIdx(d));
async function buildReport(start){
  const days=[...Array(8)].map((_,i)=>addDays(start,i)).filter(d=>d<=TODAY);
  const rows=[];for(const d of days)rows.push({d,day:await getDay(d)});
  const logged=rows.filter(r=>r.day.foods.length);
  const kc=logged.map(r=>totals(r.day.foods).k),tg=logged.map(r=>targets(r.d).kcal);
  const trainDays=rows.filter(r=>dayPlan(r.d).type==='train');
  const w=S.profile.weights,wd=Object.keys(w).filter(d=>d>=start&&d<=addDays(start,7)).sort();
  const prs=[];const log=S.profile.liftLog||{};
  Object.keys(log).forEach(id=>{const h=log[id],ds=Object.keys(h).sort();let best=0;ds.forEach(d=>{const v=e1rm(h[d]);if(v>best){if(d>=start&&d<=addDays(start,7)&&best>0)prs.push(id);best=v}})});
  return{start,days:rows.length,logged:logged.length,
    avgK:logged.length?r0(kc.reduce((a,b)=>a+b,0)/logged.length):0,avgT:logged.length?r0(tg.reduce((a,b)=>a+b,0)/logged.length):0,
    protein:rows.filter(r=>CHECKS.protein(r.d,r.day)).length,water:rows.filter(r=>CHECKS.water(r.d,r.day)).length,
    workouts:trainDays.filter(r=>CHECKS.train(r.d,r.day)).length,trainDays:trainDays.length,
    wFrom:wd.length?w[wd[0]]:null,wTo:wd.length?w[wd[wd.length-1]]:null,prs:[...new Set(prs)]};
}
function viewReport(){
  const cur=cycleStartOf(TODAY),sel=S.repStart||cur,prev=addDays(cur,-8);
  if(!S.repData||S.repData.start!==sel){buildReport(sel).then(r=>{S.repData=r;if(S.tab==='progress'&&S.progSub==='report')render()});return `<section class="card"><p class="muted">Building your report…</p></section>`}
  const r=S.repData,st=weightStats();
  let action;
  if(r.logged<4)action='Log food on at least 4 days of a cycle to get a useful report.';
  else if(r.protein<r.days/2)action='Protein is your gap. Use the protein helper on Today every afternoon.';
  else if(st.rate!==null&&st.rate<0.2)action='Weight is barely moving. Add 150 kcal.';
  else if(st.rate!==null&&st.rate>0.5)action='Weight is rising too fast. Take 150 kcal off.';
  else if(r.workouts<r.trainDays)action='Food is on track. Make every training day count this cycle.';
  else action='Everything is on track. Keep going.';
  const adjBtn=/Add 150/.test(action)?`<button class="btn sm" data-a="adj" data-v="150">Add 150 kcal</button>`:/150 kcal off/.test(action)?`<button class="btn sm" data-a="adj" data-v="-150">Take 150 off</button>`:'';
  const stat=(v,l)=>`<div class="stat"><b class="num">${v}</b><span>${l}</span></div>`;
  return `<section class="card">
    <div class="row between"><div><div class="eyebrow">8-day cycle report</div><h3>${esc(fmtDate(sel))} – ${esc(fmtDate(addDays(sel,7)))}</h3></div>
      <div class="tabs-inline">${prev>=START?`<button class="${sel===prev?'on':''}" data-a="repStart" data-v="${prev}">Last</button>`:''}<button class="${sel===cur?'on':''}" data-a="repStart" data-v="${cur}">This</button></div></div>
    ${sel===cur&&r.days<8?`<p class="muted" style="font-size:12.5px">In progress: day ${r.days} of 8.</p>`:''}
    <div class="stats">
      ${stat(r.logged?r.avgK:'—','Avg kcal'+(r.logged?' / '+r.avgT:''))}
      ${stat(r.protein+'/'+r.days,'Protein days')}
      ${stat(r.workouts+'/'+r.trainDays,'Workouts done')}
      ${stat(r.water+'/'+r.days,'Water days')}
      ${stat(r.wFrom!=null&&r.wTo!=null&&r.wFrom!==r.wTo?(r.wTo-r.wFrom>=0?'+':'')+r1(r.wTo-r.wFrom):'—','Weight change kg')}
      ${stat(r.prs.length,'New PRs')}
    </div>
    ${r.prs.length?`<p style="font-size:13px"><b>PRs:</b> ${r.prs.map(id=>esc((EXBYID[id]||{n:id}).n)).join(', ')}</p>`:''}
    <div class="callout"><b>Next cycle</b><p>${esc(action)}</p>${adjBtn?`<div>${adjBtn}</div>`:''}</div>
  </section>`;
}

/* ---------- move a day's log to another date (for logging on the wrong day) ---------- */
function dayHasData(){const d=S.day;return d.foods.length||d.water||d.sleep||['routine','habits','supps','sets','kg','reps'].some(k=>Object.values(d[k]||{}).some(v=>Array.isArray(v)?v.some(Boolean):v))||S.profile.weights[S.date]!=null&&S.date!==REPORT.date}
function viewMoveDay(){
  const to=S.moveTo||addDays(S.date,1);
  return `<section class="card">
    <h3>Logged on the wrong day?</h3>
    ${S.confirm==='move'?`<p style="font-size:14px">Move everything from <b>${esc(fmtDate(S.date))}</b> to <b>${esc(fmtDate(to))}</b>? Food, water, checklists, sleep, workout sets and weight move. ${esc(fmtDate(S.date))} is left empty. If ${esc(fmtDate(to))} already has entries, they are kept and combined.</p>
      <div class="row"><button class="btn" data-a="doMove">Move</button><button class="btn ghost" data-a="cancelConfirm">Cancel</button></div>`
    :`<div class="row"><label class="f" style="flex:1">Move this day's log to<input id="moveTo" type="date" value="${to}" data-c="moveTo"></label><button class="btn" style="align-self:end" data-a="askMove">Move</button></div>`}
  </section>`;
}
async function moveDay(src,target){
  const from=S.day,to=Object.assign(blankDay(),await load(dayKey(target))||{});
  to.foods=[...to.foods,...from.foods];
  to.water=Math.min(14,(to.water||0)+(from.water||0));
  ['routine','habits','supps','sets','kg','reps'].forEach(k=>{to[k]={...(from[k]||{}),...(to[k]||{})}});
  if(!to.sleep)to.sleep=from.sleep;
  save(dayKey(target),to);save(dayKey(src),blankDay());S.dayCache[target]=to;S.dayCache[src]=blankDay();S.repData=null;scheduleStreaks();
  const pr=S.profile;
  if(pr.weights[src]!=null&&src!==REPORT.date&&pr.weights[target]==null){const w={...pr.weights};w[target]=w[src];delete w[src];pr.weights=w}
  const log={...(pr.liftLog||{})};Object.keys(log).forEach(id=>{const h={...log[id]};if(h[src]&&!h[target]){h[target]=h[src];delete h[src];log[id]=h}});pr.liftLog=log;
  const lifts={...(pr.lifts||{})};Object.keys(lifts).forEach(id=>{if(lifts[id].date===src)lifts[id]={...lifts[id],date:target}});pr.lifts=lifts;
  saveProfile();
}

/* ---------- strength log: profile.liftLog[exerciseId][date] = {kg, reps} ---------- */
function logLift(id){
  const kg=parseFloat(S.day.kg[id]),reps=parseInt((S.day.reps||{})[id])||null;
  const ex={...((S.profile.liftLog||{})[id]||{})};
  if(kg>0)ex[S.date]={kg,reps};else delete ex[S.date];
  S.profile.liftLog={...(S.profile.liftLog||{}),[id]:ex};
  if(kg>0&&S.date>=((S.profile.lifts[id]||{}).date||''))S.profile.lifts={...S.profile.lifts,[id]:{kg:String(kg),date:S.date}};
  saveProfile();
}
const e1rm=x=>x.reps?x.kg*(1+x.reps/30):x.kg;
const fmtSet=x=>x.kg+' kg'+(x.reps?' × '+x.reps:'');
function spark(vals){
  if(vals.length<2)return '<svg width="84" height="28"></svg>';
  const lo=Math.min(...vals),hi=Math.max(...vals),rg=hi-lo||1;
  const pts=vals.map((v,i)=>[2+i/(vals.length-1)*80,24-(v-lo)/rg*20]);
  const last=pts[pts.length-1];
  return `<svg width="84" height="28" viewBox="0 0 84 28" aria-hidden="true"><path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--prot)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--prot)"/></svg>`;
}
function viewStrength(){
  const log=S.profile.liftLog||{},seen=new Set(),rows=[];
  CYCLE.forEach(k=>PLANS[k].blocks.forEach(b=>b.items.forEach(e=>{
    if(!e.w||seen.has(e.id))return;seen.add(e.id);
    const h=log[e.id]||{},ds=Object.keys(h).sort();if(!ds.length)return;
    const best=ds.reduce((a,d)=>e1rm(h[d])>e1rm(h[a])?d:a,ds[0]);
    rows.push({e,h,ds,best,first:h[ds[0]],last:h[ds[ds.length-1]]});
  })));
  const prs=rows.filter(r=>r.ds.length>1&&r.best===r.ds[r.ds.length-1]).length;
  return `<section class="card">
    <div class="row between"><h3>Strength</h3>${rows.length?`<span class="chip ${prs?'ok':''}">${prs} lift${prs===1?'':'s'} at a PR</span>`:''}</div>
    ${rows.length?`<p class="muted" style="font-size:12.5px">Log kg and reps of your best set in the Train tab. PR = your strongest set so far, counting reps. Tap a lift for its history.</p><div>${rows.map(r=>{
      const up=r.last.kg-r.first.kg,open=S.openLift===r.e.id;
      return `<button class="lift" data-a="lift" data-v="${r.e.id}" aria-expanded="${open}"><span style="min-width:0"><b>${esc(r.e.n)}</b><small>PR ${esc(fmtSet(r.h[r.best]))} · ${r.ds.length} session${r.ds.length===1?'':'s'}</small></span><span class="v num">${esc(fmtSet(r.last))}<small style="color:${up>0?'var(--kcal)':'var(--muted)'}">${up>0?'+'+r1(up)+' kg':up<0?r1(up)+' kg':'start'}</small></span>${spark(r.ds.map(d=>e1rm(r.h[d])))}</button>
      ${open?`<div class="hist num">${r.ds.slice().reverse().slice(0,10).map(d=>`<div><span class="muted">${esc(fmtDate(d))}</span><span>${esc(fmtSet(r.h[d]))}${d===r.best?' · PR':''}</span></div>`).join('')}</div>`:''}`}).join('')}</div>`
    :`<p class="muted" style="font-size:13px">No lifts logged yet. In the Train tab, type the kg and reps of your best set for each exercise. Your strength history and PRs show up here.</p>`}
  </section>`;
}

function weightStats(){
  const w=S.profile.weights,dates=Object.keys(w).sort();
  const latestD=dates[dates.length-1],latestW=w[latestD];
  const recent=dates.filter(d=>d>=addDays(latestD,-27));
  let rate=null;
  if(recent.length>=3){
    const t0=parse(recent[0]).getTime(),xs=recent.map(d=>(parse(d).getTime()-t0)/864e5/7),ys=recent.map(d=>w[d]);
    const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
    const den=xs.reduce((a,x)=>a+(x-mx)**2,0);
    if(den>0&&xs[n-1]>=1)rate=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/den;
  }
  const wk=dates.filter(d=>d>addDays(latestD,-7)).map(d=>w[d]);
  const avg7=wk.reduce((a,b)=>a+b,0)/wk.length;
  return{dates,latestD,latestW,rate,avg7};
}
function chart(){
  const w=S.profile.weights,dates=Object.keys(w).sort();
  const W=600,H=230,L=40,R=14,T=14,B=30;
  const t0=parse(dates[0]).getTime(),t1=Math.max(parse(dates[dates.length-1]).getTime(),t0+7*864e5);
  const vals=dates.map(d=>w[d]);
  const lo=Math.floor(Math.min(...vals,REPORT.weight)-1),hi=Math.ceil(Math.max(...vals,GOAL.weight)+0.5);
  const x=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=hi-lo>8?2:1;let grid='';
  for(let v=lo;v<=hi;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const pts=dates.map(d=>[x(d),y(w[d])]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=pts.length>1?line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`:'';
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    ${grid}
    <line x1="${L}" x2="${W-R}" y1="${y(GOAL.weight)}" y2="${y(GOAL.weight)}" stroke="var(--kcal)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-R}" y="${y(GOAL.weight)-6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--kcal)">Goal ${GOAL.weight} kg</text>
    ${area?`<path d="${area}" fill="var(--carb)" fill-opacity=".10"/>`:''}
    <path d="${line}" fill="none" stroke="var(--carb)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--carb)"/>`).join('')}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--surface)" stroke="var(--carb)" stroke-width="2.5"/>
    <text x="${L}" y="${H-10}" font-size="11" fill="var(--muted)">${fmtDate(dates[0])}</text>
    <text x="${W-R}" y="${H-10}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(ymd(new Date(t1)))}</text>
  </svg>`;
}
const PSUB=[['weight','Weight'],['report','Report'],['strength','Strength'],['photos','Photos'],['body','Body'],['scan','Scan']];
const CHECKIN_DAYS=14;

function progWeight(){
  const st=weightStats(),adj=S.profile.calAdj||0;
  let chip='<span class="chip">Log 3+ weigh-ins over a week to see your rate</span>';
  if(st.rate!==null){
    if(st.rate<0.2)chip=`<span class="chip warn">${st.rate.toFixed(2)} kg/week · too slow, add 150 kcal</span>`;
    else if(st.rate>0.5)chip=`<span class="chip bad">Gaining ${r1(st.rate)} kg/week · too fast, drop 150 kcal</span>`;
    else chip=`<span class="chip ok">Gaining ${r1(st.rate)} kg/week · on track</span>`;
  }
  const toGo=r1(GOAL.weight-st.avg7);
  const eta=st.rate&&st.rate>0&&toGo>0?Math.ceil(toGo/st.rate):null;
  const etaD=eta?addDays(TODAY,eta*7):null;
  const todayW=S.profile.weights[S.date];
  return `
  <section class="card">
    <div class="row between"><h3>Weigh-in · ${esc(fmtDate(S.date))}</h3>${chip}</div>
    <div class="row"><input id="weightIn" type="number" inputmode="decimal" step="0.1" placeholder="kg, e.g. 67.2" value="${todayW??''}" aria-label="Body weight kg"><button class="btn" data-a="saveWeight">Save</button></div>
    <p class="muted" style="font-size:12.5px">Weigh every morning after the toilet, before food or water. Judge progress by the 7-day average, not one day.</p>
  </section>
  <section class="card">
    <div class="stats">
      <div class="stat"><b class="num">${r1(st.avg7)}</b><span>7-day avg (kg)</span></div>
      <div class="stat"><b class="num">${toGo>0?'+'+toGo:'0'}</b><span>kg to ${GOAL.weight}</span></div>
      <div class="stat"><b class="num">${etaD?MON[parse(etaD).getMonth()]+' '+parse(etaD).getFullYear().toString().slice(2):'—'}</b><span>Goal ETA</span></div>
    </div>
    ${chart()}
  </section>
  <section class="card">

/* AI meal photo: Claude estimates items, grams and macros */
const AI_SCHEMA={type:'object',properties:{items:{type:'array',items:{type:'object',properties:{name:{type:'string'},grams:{type:'number'},kcal:{type:'number'},protein:{type:'number'},carbs:{type:'number'},fat:{type:'number'},confidence:{type:'string',enum:['low','medium','high']}},required:['name','grams','kcal','protein','carbs','fat','confidence'],additionalProperties:false}},note:{type:'string'}},required:['items','note'],additionalProperties:false};
const aiPrompt=note=>`You estimate nutrition from a meal photo for a man on a lean bulk in the UAE.
List every distinct food and drink you can see as a separate item. Estimate each portion in grams (ml for drinks) from visual cues such as plate size (about 27 cm), cutlery, hands and packaging. Give calories, protein, carbs and fat for that portion, including visible oil, butter, sauces and dressings. When a dish looks like a typical UAE or Middle Eastern restaurant dish (machboos, mandi, shawarma, mixed grill and so on), use typical restaurant preparation. If you can read a nutrition label or a packaged product, use its numbers. Set confidence per item. In "note", say in one or two short sentences what you assumed (for example hidden oil, portion size) or why there are no items if the photo is not food.${note?`\nThe user adds: "${note.slice(0,300)}"`:''}`;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function aiBackend(){
  if(window.claude&&window.claude.use){try{const s=await window.claude.use('sample');const caps=s&&await s.limits().catch(()=>null);if(caps&&caps.images)return{type:'claude',s}}catch(e){}}
  return getKey()?{type:'key'}:null;
}
async function analyzeMeal(blob,note){
  const be=await aiBackend();
  if(!be)throw{msg:'Add your API key first.',setup:true};
  if(be.type==='claude'){
    try{return await be.s.json(aiPrompt(note)+`\nReply with JSON only: {"items":[{"name":string,"grams":number,"kcal":number,"protein":number,"carbs":number,"fat":number,"confidence":"low"|"medium"|"high"}],"note":string}`,{images:[blob],modelTier:'default',cache:false})}
    catch(e){throw{msg:e&&e.code==='not_granted'?'Allow this page to use Claude, then try again.':e&&e.code==='rate_limited'?'Too many scans in a short time. Wait a minute and try again.':'Claude could not read that photo. Try again or take a clearer picture.'}}
  }
  const {default:Anthropic}=await import(SDK_URL).catch(()=>{throw{msg:'The AI scan needs internet. Connect and try again.'}});
  const client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});
  let res;
  try{
    res=await client.beta.messages.create({
      model:'claude-opus-5-5',max_tokens:16000,
      betas:['server-side-fallback-2026-07-01'],fallbacks:'default',
      output_config:{effort:'low',format:{type:'json_schema',schema:AI_SCHEMA}},
      messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobToB64(blob)}},{type:'text',text:aiPrompt(note)}]}],
    });
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError)throw{msg:'Your API key was rejected. Check it in the AI key settings.',setup:true};
    if(e instanceof Anthropic.RateLimitError)throw{msg:'Too many requests right now. Wait a minute and try again.'};
    if(e instanceof Anthropic.APIConnectionError)throw{msg:'Could not reach the AI service. Check your internet and try again.'};
    if(e instanceof Anthropic.APIError)throw{msg:e.type==='billing_error'||/credit/i.test(e.message||'')?'Your Anthropic account is out of credit. Add credit at console.anthropic.com → Billing.':'The AI service returned an error ('+(e.status||'?')+'). Try again.'};
    throw{msg:'Something went wrong. Try again.'};
  }
  if(res.stop_reason==='refusal')throw{msg:'The AI declined this photo. Try a photo of just the food.'};
  if(res.stop_reason==='max_tokens')throw{msg:'The answer was cut off. Try again.'};
  try{return JSON.parse(res.content.filter(b=>b.type==='text').map(b=>b.text).join(''))}catch(e){throw{msg:'The AI answer could not be read. Try again.'}}
}
async function runAI(file){

  if(S.sheet===sh)renderSheet();
}

/* ---------- rest timer ---------- */
const EXBYID={};Object.values(PLANS).forEach(p=>p.blocks.forEach(b=>b.items.forEach(e=>{EXBYID[e.id]=e})));
const T={end:0,total:0,iv:null,ac:null,done:false};
const mmss=n=>Math.floor(n/60)+':'+pad(n%60);
function restSecs(r){const m=String(r).match(/(\d+)(?:–(\d+))?\s*(min|s)\b/);if(!m)return 0;const v=(+m[1]+(m[2]?+m[2]:+m[1]))/2;return Math.round(m[3]==='min'?v*60:v)}
function startTimer(e){
  const sec=restSecs(e.rest);if(!sec)return;
  try{T.ac=T.ac||new(window.AudioContext||window.webkitAudioContext)();T.ac.resume()}catch(err){}
  T.total=sec;T.end=Date.now()+sec*1000;T.done=false;
  $('#timer').innerHTML=`<div class="timer" role="timer"><div class="tl"><b class="num" id="tLeft"></b><small id="tLabel"></small></div><button data-a="tAdd" data-v="-15" aria-label="15 seconds less">−15</button><button data-a="tAdd" data-v="15" aria-label="15 seconds more">+15</button><button data-a="tStop">Skip</button><i id="tBar"></i></div>`;
  T.label=e.n;document.body.classList.add('timing');
  clearInterval(T.iv);T.iv=setInterval(tick,250);tick();
}
function tick(){
  if(!T.end)return;
  const left=Math.ceil((T.end-Date.now())/1000),box=$('#timer .timer');if(!box)return;
  if(left<=0&&!T.done){T.done=true;beep();box.classList.add('go')}
  if(left<=-10){stopTimer();return}
  $('#tLeft').textContent=left>0?mmss(left):'Go!';
  $('#tLabel').textContent=(left>0?'Rest · ':'Next set · ')+T.label;
  $('#tBar').style.width=Math.max(0,left)/T.total*100+'%';
}
function stopTimer(){clearInterval(T.iv);T.end=0;$('#timer').innerHTML='';document.body.classList.remove('timing')}
function beep(){
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  const ac=T.ac;if(!ac)return;
  [0,0.25,0.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.4,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);o.start(s);o.stop(s+0.2)});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});

  ramToggle(){const r=ramadan();S.profile.ramadan={...r,on:!r.on};saveProfile();render()},
  repStart(v){S.repStart=v;S.repData=null;render()},
  logIdea(v){const meal=suggestMeal();v.split(',').forEach(x=>{const[id,q]=x.split(':');S.day.foods.push(entryFrom(foodById(id),Number(q),meal))});saveDay();render()},
  askSaveMeal(v){S.saveMealFor=v;render();setTimeout(()=>{const i=$('#smName');i&&i.select&&i.select()},30)},
  cancelSaveMeal(){S.saveMealFor=null;render()},
  saveMeal(v){
    const n=($('#smName').value||'').trim().slice(0,40)||mealName(v);
    const items=S.day.foods.filter(e=>e.meal===v).map(({id,meal,...rest})=>rest);if(!items.length)return;
    S.profile.savedMeals=[{id:'sm-'+uid(),n,items},...(S.profile.savedMeals||[])].slice(0,40);saveProfile();S.saveMealFor=null;render();
  },
  addSaved(v){const sm=(S.profile.savedMeals||[]).find(x=>x.id===v);if(!sm)return;sm.items.forEach(it=>S.day.foods.push({...it,id:uid(),meal:S.sheet.meal}));saveDay();S.sheet=null;render()},
  delSaved(v){S.profile.savedMeals=(S.profile.savedMeals||[]).filter(x=>x.id!==v);saveProfile();renderSheet()},
  askMove(){const v=($('#moveTo')||{}).value;if(!v||v===S.date)return;S.moveTo=v;S.confirm='move';render()},
  async doMove(){const src=S.date,to=S.moveTo;S.confirm=null;S.moveTo=null;if(!to||to===src)return;await moveDay(src,to);await goDate(to)},
  cancelConfirm(){S.confirm=null;render()},
  resetGrocery(){S.profile.grocery={};S.confirm=null;saveProfile();render()},
  exportData(){
    const out={app:'gymbro',version:1,exported:new Date().toISOString(),data:{}};
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(LS)&&k!==LS+'tab')out.data[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download='gymbro-backup-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();
    S.backupMsg='Backup saved with '+Object.keys(out.data).length+' records.';render();
  },
};
function suggestMeal(){
  const h=new Date().getHours(),type=dayType(S.date);
  if(isRamadan(S.date)){if(S.date!==TODAY)return 'iftar';return h<5?'suhoor':h<19?'iftar':h<21?'main':h<22?(type==='train'?'rpre':'late'):h<23?(type==='train'?'rpost':'late'):'late'}
  const order=[[10,'breakfast'],[13,'snack'],[16,'lunch'],[19,type==='train'?'pre':'dinner'],[21,type==='train'?'post':'dinner'],[24,'dinner']];
  return S.date===TODAY?order.find(([lim])=>h<lim)[1]:'breakfast';
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const fn=actions[el.dataset.a];if(fn)fn(el.dataset.v,el,ev);
});
let searchT;
document.addEventListener('input',ev=>{
  const el=ev.target,c=el.dataset.c;
  if(c==='search'){S.sheet.q=el.value;clearTimeout(searchT);searchT=setTimeout(()=>{const pos=el.selectionStart;renderSheet();const i=$('#foodSearch');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}},120)}
  if(c==='qty'){S.sheet.qty=Number(el.value)||0}
  if(c==='aiNote'){S.sheet.aiNote=el.value}
});
document.addEventListener('change',ev=>{
  const el=ev.target,c=el.dataset.c;
  if(c==='qty'){S.sheet.qty=Math.max(0.25,Number(el.value)||1);renderSheet()}
  if(c==='amt'){const a=amtInfo(pickedFood());S.sheet.qty=Math.max(1,Number(el.value)||a.base)/a.base;renderSheet()}
  if(c==='aig'){const it=S.sheet.ai.items[+el.dataset.v];it.grams=Math.max(0,Number(el.value)||0);renderSheet()}
  if(c==='aiFile'&&el.files[0])runAI(el.files[0]);
  if(c==='sleep'){S.day.sleep=el.value;saveDay()}
  if(c==='cmpA'||c==='cmpB'){S[c]=el.value;render()}
  if(c==='moveTo'){S.moveTo=el.value}
  if(c==='ramS'||c==='ramE'){const r=ramadan(),k=c==='ramS'?'start':'end';if(el.value){S.profile.ramadan={...r,[k]:el.value};saveProfile();render()}}
  if(c==='photo'&&el.files[0]){const pose=el.dataset.v,date=S.date,file=el.files[0];(async()=>{
    try{const blob=await shrinkImage(file);await PhotoDB.put({key:date+'|'+pose,date,pose,blob});S.photoErr=''}
    catch(e){S.photoErr='Could not save that photo. Try a JPEG or PNG from your Photos.'}
    await loadPhotos();render();
  })()}
  if(c==='import'&&el.files[0]){el.files[0].text().then(async txt=>{
    try{const b=JSON.parse(txt);if(b.app!=='gymbro'||!b.data)throw 0;
      Object.entries(b.data).forEach(([k,v])=>save(k,v));
      await loadProfile();await loadDay();S.backupMsg='Restored '+Object.keys(b.data).length+' records.';
    }catch(e){S.backupMsg='That file is not a GYMBRO backup. Pick a file named gymbro-backup-….json.'}
    render();
  })}
  if(c==='kg'||c==='reps'){const id=el.dataset.v;S.day[c]={...(S.day[c]||{}),[id]:el.value};saveDay();logLift(id)}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){stopScan();S.sheet=null;renderSheet()}if(ev.key==='Enter'&&ev.target.id==='foodSearch'&&S.sheet&&(S.sheet.q||'').trim().length>=2)searchOnline(S.sheet.q.trim());if(ev.key==='Enter'&&ev.target.id==='weightIn')actions.saveWeight();if(ev.key==='Enter'&&ev.target.id==='nameIn')actions.saveName()});

/* ---------- boot ---------- */
(async()=>{
  S.profile=Object.assign(blankProfile(),lsGet('profile')||{});
  S.day=Object.assign(blankDay(),lsGet(dayKey(S.date))||{});
  render();
  loadPhotos().then(()=>{if(S.tab==='progress'||S.tab==='today')render()});
  await initCloud();
  if(Cloud.ready){S.dayCache={};await loadProfile();await loadDay();render()}
  await computeStreaks();if(S.tab==='today')render();
})();
</script>

<style>.updbar{position:fixed;z-index:60;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));max-width:616px;margin:0 auto;border:0;border-radius:14px;padding:13px 16px;font:700 15px/1.2 system-ui,sans-serif;background:#1E5BCB;color:#fff;box-shadow:0 8px 24px rgb(0 0 0 / .3)}.ver{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 8px}</style>
<script>
const APP_VERSION='a9b2ff9fe7';
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
(()=>{const v=document.createElement('div');v.className='ver';v.textContent='Version '+APP_VERSION;const w=document.querySelector('div.wrap');w&&w.appendChild(v)})();
async function checkUpdate(){
  try{
    const t=await (await fetch('./index.html?check='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/APP_VERSION='([0-9a-f]+)'/);
    if(m&&m[1]!==APP_VERSION&&!document.getElementById('upd')){
      const b=document.createElement('button');b.id='upd';b.className='updbar';b.textContent='New version ready · Tap to update';
      b.onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration();r&&await r.update()}catch(e){}location.reload()};
      document.body.appendChild(b);
    }
  }catch(e){}
}
addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,2500);
</script>
