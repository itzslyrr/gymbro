function mealItems(m,type){let it=m.items;if(m.train&&type!=='train')return[];if(type==='rest'&&m.restExtra)it=it.concat(m.restExtra);return it}

const LS='gymbro:';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}};
const Cloud={db:null,uid:null,ready:false,err:false};
const timers={},chains={},latest={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function initCloud(){
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await sleep(100);
  if(!(window.claude&&window.claude.use))return;
  try{
    const to=()=>new Promise(r=>setTimeout(()=>r(null),10000));
    const[db,user]=await Promise.all([Promise.race([window.claude.use('db'),to()]),Promise.race([window.claude.use('user'),to()])]);
    const id=user?await user.id():null;
    if(db&&id){Cloud.db=db;Cloud.uid=id;Cloud.ready=true}
  }catch(e){}
}
const ref=k=>Cloud.db.doc('data/users/'+Cloud.uid+'/'+k);
async function load(k){
  const local=lsGet(k);
  if(!Cloud.ready)return local;
  try{
    const snap=await ref(k).get();
    if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()));lsSet(k,d);return d}
    if(local)save(k,local);
    return local;
  }catch(e){return local}
}
function save(k,v){
  latest[k]=v;lsSet(k,v);
  if(!Cloud.ready)return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    chains[k]=(chains[k]||Promise.resolve()).then(()=>ref(k).set(latest[k])).then(()=>{Cloud.err=false;renderSync()}).catch(()=>{Cloud.err=true;renderSync()});
  },700);
}
function renderSync(){$('#sync').textContent=Cloud.ready?(Cloud.err?'Could not sync the last change. It is saved on this device.':'Synced to your Claude account'):'Saved on this device'}

  if(recent.length>=3){
    const t0=parse(recent[0]).getTime(),xs=recent.map(d=>(parse(d).getTime()-t0)/864e5/7),ys=recent.map(d=>w[d]);
    const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
    const den=xs.reduce((a,x)=>a+(x-mx)**2,0);
    if(den>0&&xs[n-1]>=1)rate=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/den;
  }
  const wk=dates.filter(d=>d>addDays(latestD,-7)).map(d=>w[d]);
  const avg7=wk.reduce((a,b)=>a+b,0)/wk.length;
  return{dates,latestD,latestW,rate,avg7};
}
function chart(){
  const w=S.profile.weights,dates=Object.keys(w).sort();
  const W=600,H=230,L=40,R=14,T=14,B=30;
  const t0=parse(dates[0]).getTime(),t1=Math.max(parse(dates[dates.length-1]).getTime(),t0+7*864e5);
  const vals=dates.map(d=>w[d]);
  const lo=Math.floor(Math.min(...vals,REPORT.weight)-1),hi=Math.ceil(Math.max(...vals,GOAL.weight)+0.5);
  const x=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=hi-lo>8?2:1;let grid='';
  for(let v=lo;v<=hi;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const pts=dates.map(d=>[x(d),y(w[d])]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=pts.length>1?line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`:'';
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    ${grid}
    <line x1="${L}" x2="${W-R}" y1="${y(GOAL.weight)}" y2="${y(GOAL.weight)}" stroke="var(--kcal)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-R}" y="${y(GOAL.weight)-6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--kcal)">Goal ${GOAL.weight} kg</text>
    ${area?`<path d="${area}" fill="var(--carb)" fill-opacity=".10"/>`:''}
    <path d="${line}" fill="none" stroke="var(--carb)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--carb)"/>`).join('')}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--surface)" stroke="var(--carb)" stroke-width="2.5"/>
    <text x="${L}" y="${H-10}" font-size="11" fill="var(--muted)">${fmtDate(dates[0])}</text>
    <text x="${W-R}" y="${H-10}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(ymd(new Date(t1)))}</text>
  </svg>`;
}
function viewProgress(){
  const st=weightStats(),adj=S.profile.calAdj||0;
  let chip='<span class="chip">Log 3+ weigh-ins over a week to see your rate</span>';
  if(st.rate!==null){
    if(st.rate<0.2)chip=`<span class="chip warn">${st.rate.toFixed(2)} kg/week · too slow, add 150 kcal</span>`;
    else if(st.rate>0.5)chip=`<span class="chip bad">Gaining ${r1(st.rate)} kg/week · too fast, drop 150 kcal</span>`;
    else chip=`<span class="chip ok">Gaining ${r1(st.rate)} kg/week · on track</span>`;
  }
  const toGo=r1(GOAL.weight-st.avg7);
  const eta=st.rate&&st.rate>0&&toGo>0?Math.ceil(toGo/st.rate):null;
  const etaD=eta?addDays(TODAY,eta*7):null;
  const todayW=S.profile.weights[S.date];
  return `
  <section class="card">
    <div class="row between"><h3>Weigh-in · ${esc(fmtDate(S.date))}</h3>${chip}</div>
    <div class="row"><input id="weightIn" type="number" inputmode="decimal" step="0.1" placeholder="kg, e.g. 67.2" value="${todayW??''}" aria-label="Body weight kg"><button class="btn" data-a="saveWeight">Save</button></div>
    <p class="muted" style="font-size:12.5px">Weigh every morning after the toilet, before food or water. Judge progress by the 7-day average, not one day.</p>
  </section>
  <section class="card">
    <div class="stats">
      <div class="stat"><b class="num">${r1(st.avg7)}</b><span>7-day avg (kg)</span></div>
      <div class="stat"><b class="num">${toGo>0?'+'+toGo:'0'}</b><span>kg to ${GOAL.weight}</span></div>
      <div class="stat"><b class="num">${etaD?MON[parse(etaD).getMonth()]+' '+parse(etaD).getFullYear().toString().slice(2):'—'}</b><span>Goal ETA</span></div>
    </div>
    ${chart()}
  </section>
  <section class="card">
    <div class="row between"><h3>Calorie adjustment</h3><span class="chip num">${adj>0?'+':''}${adj} kcal</span></div>
    <p class="muted" style="font-size:13px">Aim for ${GOAL.rateLo}–${GOAL.rateHi} kg per week. If the weekly average barely moves for 2 weeks, add 150 kcal (easiest: 150 g cottage cheese before bed, or 50 g more rice). If you gain over 0.5 kg a week, take 150 off. Changes go on top of carbs.</p>
    <div class="row"><button class="btn ghost sm" data-a="adj" data-v="-150">− 150</button><button class="btn ghost sm" data-a="adj" data-v="150">+ 150</button>${adj?`<button class="btn ghost sm" data-a="adj" data-v="0">Reset</button>`:''}</div>
    <p class="num" style="font-size:13px">Now: training days ${TARGET.train.kcal+adj} kcal · rest days ${TARGET.rest.kcal+adj} kcal</p>
  </section>
  <section class="card">
    <div class="eyebrow">Dr. Nutrition scan · ${fmtDate(REPORT.date)} 2026</div>
    <h3>Where you started</h3>
    <div class="stats">
      <div class="stat"><b class="num">${REPORT.weight}</b><span>Weight kg</span></div>
      <div class="stat"><b class="num">${r1(REPORT.fatKg/REPORT.weight*100)}%</b><span>Body fat (${REPORT.fatKg} kg)</span></div>
      <div class="stat"><b class="num">${REPORT.slm}</b><span>Soft lean mass kg</span></div>
      <div class="stat"><b class="num">${REPORT.bmr}</b><span>BMR kcal (at rest)</span></div>
      <div class="stat"><b class="num">${REPORT.tee}</b><span>Total burn kcal/day</span></div>
      <div class="stat"><b class="num">${REPORT.bmi}</b><span>BMI</span></div>
    </div>
    <p class="muted" style="font-size:13px">The scan rates you "low fat, muscular" and ${r1(REPORT.stdWeight-REPORT.weight)} kg under the standard weight of ${REPORT.stdWeight} kg for your height. Your total burn is ${REPORT.tee} kcal, and training adds about 200–300 on lifting days. That is why the targets are ${TARGET.train.kcal} kcal on training days and ${TARGET.rest.kcal} on rest days: a surplus of roughly 300 kcal for lean gains. Protein is about 2.5 g per kg.</p>
  </section>
  ${Cloud.ready?'':`<section class="card">
    <h3>Backup</h3>
    <p class="muted" style="font-size:13px">Your logs are stored on this phone only. Save a backup file every week or two (to Files or iCloud Drive), and restore it here if you change phones.</p>
    ${S.backupMsg?`<p style="font-size:13px;font-weight:600">${esc(S.backupMsg)}</p>`:''}
    <div class="row"><button class="btn ghost sm" data-a="exportData">Save backup</button><label class="btn ghost sm" for="importIn">Restore backup</label><input id="importIn" type="file" accept=".json,application/json" data-c="import" hidden></div>
  </section>`}`;
}

function viewShop(){
  const g=S.profile.grocery,all=GROCERY.flatMap(s=>s.items),done=all.filter(([k])=>g[k]).length;
  return `
  <section class="card">
    <div class="row between"><div><div class="eyebrow">One week at plan</div><h2>Grocery list</h2></div><span class="chip num">${done}/${all.length}</span></div>
    ${S.confirm==='grocery'?`<div class="row"><span style="flex:1;font-size:13px">Untick everything for a new week?</span><button class="btn sm" data-a="resetGrocery">Untick all</button><button class="btn ghost sm" data-a="cancelConfirm">Cancel</button></div>`:`<button class="btn ghost sm" style="justify-self:start" data-a="askReset">New week: untick all</button>`}
  </section>
  ${GROCERY.map(s=>`<section class="card"><h3>${esc(s.t)}</h3><div class="list">${s.items.map(([k,n,q])=>`<div class="li"><button class="check ${g[k]?'on':''}" data-a="grocery" data-v="${k}" aria-label="${esc(n)}"></button><div class="t" style="${g[k]?'opacity:.5;text-decoration:line-through':''}"><b>${esc(n)}</b><small>${esc(q)}</small></div></div>`).join('')}</div></section>`).join('')}`;
}

/* ---------- add-food sheet ---------- */
function renderSheet(){
  const el=$('#sheet');
  if(!S.sheet){el.innerHTML='';return}
  const sh=S.sheet,type=dayType(S.date);
  const meals=MEALS.filter(m=>!(m.train&&type!=='train'));
  if(!sh.meal)sh.meal=meals[0].id;
  let body;
  if(sh.mode==='pick'){
    const f=foodById(sh.fid),q=sh.qty;
    body=`<div class="card"><div><b style="font-size:17px">${esc(f.n)}</b><p class="muted">${esc(f.u)} = ${f.k} kcal · P ${f.p} · C ${f.c} · F ${f.f}</p></div>
      <div class="row between"><div class="qty"><button data-a="qty" data-v="-0.5" aria-label="Less">−</button><input id="qtyIn" type="number" inputmode="decimal" step="0.25" min="0.25" value="${q}" data-c="qty" aria-label="Servings"><button data-a="qty" data-v="0.5" aria-label="More">+</button></div><span class="muted">servings</span></div>
      <p class="num" style="font-weight:600">${r0(f.k*q)} kcal · P ${r0(f.p*q)} · C ${r0(f.c*q)} · F ${r0(f.f*q)}</p>
      <div class="row"><button class="btn ghost" data-a="sheetBack">Back</button><button class="btn" style="flex:1" data-a="addFood">Add to ${esc(MEALS.find(m=>m.id===sh.meal).n)}</button></div></div>`;
  }else if(sh.mode==='custom'){
    body=`<div class="card"><b>New food</b>
      <label class="f">Name<input id="cfN" type="text" placeholder="e.g. Mum's machboos"></label>
      <label class="f">Serving<input id="cfU" type="text" placeholder="e.g. 1 plate, 100 g"></label>
      <div class="grid2"><label class="f">kcal<input id="cfK" type="number" inputmode="decimal"></label><label class="f">Protein g<input id="cfP" type="number" inputmode="decimal"></label><label class="f">Carbs g<input id="cfC" type="number" inputmode="decimal"></label><label class="f">Fat g<input id="cfF" type="number" inputmode="decimal"></label></div>
      ${sh.err?`<p style="color:var(--prot);font-size:13px">${esc(sh.err)}</p>`:''}
      <div class="row"><button class="btn ghost" data-a="sheetBack">Back</button><button class="btn" style="flex:1" data-a="saveCustom">Save food</button></div></div>`;
  }else{
    const q=(sh.q||'').toLowerCase().trim();
    const list=[...(S.profile.customFoods||[]),...FOODS].filter(f=>!q||f.n.toLowerCase().includes(q));
    body=`${list.map(f=>`<button class="food-pick" data-a="pickFood" data-v="${f.id}"><span class="t"><b>${esc(f.n)}${f.custom?' <span class="chip" style="padding:1px 7px;font-size:10px">mine</span>':''}</b><small class="num">${esc(f.u)} · P ${f.p} · C ${f.c} · F ${f.f}</small></span><span class="k num">${f.k}</span></button>`).join('')||'<p class="muted" style="padding:12px 0">No match. Add it as your own food.</p>'}
      <button class="btn ghost full" style="margin-top:12px" data-a="customMode">+ Create your own food</button>`;
  }
  el.innerHTML=`<div class="sheet-bg" data-a="closeSheet"><div class="sheet" role="dialog" aria-label="Add food">
    <div class="sh"><div class="row between"><h3>Add food</h3><button class="x" data-a="closeSheet" aria-label="Close">×</button></div>
      <div class="tabs-inline">${meals.map(m=>`<button class="${m.id===sh.meal?'on':''}" data-a="sheetMeal" data-v="${m.id}">${esc(m.n)}</button>`).join('')}</div>
      ${sh.mode==='search'?`<input id="foodSearch" type="search" placeholder="Search ${FOODS.length}+ foods" value="${esc(sh.q||'')}" data-c="search" autocomplete="off">`:''}</div>
    <div></div><div class="sb">${body}</div></div></div>`;
}

/* ---------- render ---------- */
function render(){
  renderHeader();renderTabs();renderSync();
  const v={today:viewToday,food:viewFood,train:viewTrain,face:viewFace,progress:viewProgress,shop:viewShop}[S.tab]||viewToday;
  $('#view').innerHTML=v();
  renderSheet();
}

/* ---------- actions ---------- */
async function goDate(s){S.date=s;S.trainDay=null;S.day=blankDay();render();await loadDay();render()}
const actions={
  tab(v){S.tab=v;S.confirm=null;if(v==='train')S.trainDay=null;try{localStorage.setItem(LS+'tab',v)}catch(e){}render();window.scrollTo(0,0)},
  prev(){goDate(addDays(S.date,-1))},
  next(){goDate(addDays(S.date,1))},
  water(v){const n=Number(v);S.day.water=S.day.water===n?n-1:n;saveDay();render()},
  supp(v){S.day.supps[v]=!S.day.supps[v];saveDay();render()},
  routine(v){S.day.routine[v]=!S.day.routine[v];saveDay();render()},
  habit(v){S.day.habits[v]=!S.day.habits[v];saveDay();render()},
  set(v,el){const i=Number(el.dataset.i),a=(S.day.sets[v]||[]).slice();a[i]=!a[i];S.day.sets[v]=a;saveDay();render()},
  trainDay(v){S.trainDay=Number(v);render()},
  delFood(v){S.day.foods=S.day.foods.filter(e=>e.id!==v);saveDay();render()},
  logPlan(v){const m=MEALS.find(x=>x.id===v);mealItems(m,dayType(S.date)).forEach(([id,q])=>S.day.foods.push(entryFrom(foodById(id),q,m.id)));saveDay();render()},
  openAdd(v){S.sheet={mode:'search',meal:v||suggestMeal(),q:'',qty:1};renderSheet();setTimeout(()=>{const i=$('#foodSearch');if(i&&matchMedia('(hover:hover)').matches)i.focus()},50)},
  closeSheet(v,el,ev){if(ev.target!==el)return;S.sheet=null;renderSheet()},
  sheetMeal(v){S.sheet.meal=v;renderSheet()},
  pickFood(v){Object.assign(S.sheet,{mode:'pick',fid:v,qty:1});renderSheet()},
  sheetBack(){S.sheet.mode='search';S.sheet.err='';renderSheet()},
  customMode(){S.sheet.mode='custom';renderSheet()},
  qty(v){S.sheet.qty=Math.max(0.25,Math.round((Number(S.sheet.qty)+Number(v))*4)/4);renderSheet()},
  addFood(){const sh=S.sheet;S.day.foods.push(entryFrom(foodById(sh.fid),Number(sh.qty)||1,sh.meal));saveDay();S.sheet=null;render()},
  saveCustom(){
    const g=id=>$(id).value.trim(),n=g('#cfN'),u=g('#cfU')||'1 serving',k=Number(g('#cfK'));
    if(!n||!k){S.sheet.err='Add at least a name and calories.';renderSheet();return}
    const f={id:'c-'+uid(),n,u,k,p:Number(g('#cfP'))||0,c:Number(g('#cfC'))||0,f:Number(g('#cfF'))||0,custom:true};
    S.profile.customFoods=[f,...(S.profile.customFoods||[])];saveProfile();
    Object.assign(S.sheet,{mode:'pick',fid:f.id,qty:1,err:''});renderSheet();
  },
  saveWeight(){const v=Number($('#weightIn').value);if(!(v>30&&v<200))return;S.profile.weights={...S.profile.weights,[S.date]:r1(v)};saveProfile();render()},
  adj(v){const n=Number(v);S.profile.calAdj=n===0?0:Math.max(-600,Math.min(900,(S.profile.calAdj||0)+n));saveProfile();render()},
  grocery(v){S.profile.grocery={...S.profile.grocery,[v]:!S.profile.grocery[v]};saveProfile();render()},
  saveName(){const v=$('#nameIn').value.trim().slice(0,30);if(!v)return;S.profile.name=v;saveProfile();render()},
  askReset(){S.confirm='grocery';render()},
  cancelConfirm(){S.confirm=null;render()},
  resetGrocery(){S.profile.grocery={};S.confirm=null;saveProfile();render()},
  exportData(){
    const out={app:'gymbro',version:1,exported:new Date().toISOString(),data:{}};
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(LS)&&k!==LS+'tab')out.data[k.slice(LS.length)]=JSON.parse(localStorage.getItem(k))}}catch(e){}
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download='gymbro-backup-'+TODAY+'.json';document.body.appendChild(a);a.click();a.remove();
    S.backupMsg='Backup saved with '+Object.keys(out.data).length+' records.';render();
  },
};
function suggestMeal(){
  const h=new Date().getHours(),type=dayType(S.date);
  const order=[[10,'breakfast'],[13,'snack'],[16,'lunch'],[19,type==='train'?'pre':'dinner'],[21,type==='train'?'post':'dinner'],[24,'dinner']];
  return S.date===TODAY?order.find(([lim])=>h<lim)[1]:'breakfast';
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const fn=actions[el.dataset.a];if(fn)fn(el.dataset.v,el,ev);
});
let searchT;
document.addEventListener('input',ev=>{
  const el=ev.target,c=el.dataset.c;
  if(c==='search'){S.sheet.q=el.value;clearTimeout(searchT);searchT=setTimeout(()=>{const pos=el.selectionStart;renderSheet();const i=$('#foodSearch');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}},120)}
  if(c==='qty'){S.sheet.qty=Number(el.value)||0}
});
document.addEventListener('change',ev=>{
  const el=ev.target,c=el.dataset.c;
  if(c==='qty'){S.sheet.qty=Math.max(0.25,Number(el.value)||1);renderSheet()}
  if(c==='sleep'){S.day.sleep=el.value;saveDay()}
  if(c==='import'&&el.files[0]){el.files[0].text().then(async txt=>{
    try{const b=JSON.parse(txt);if(b.app!=='gymbro'||!b.data)throw 0;
      Object.entries(b.data).forEach(([k,v])=>save(k,v));
      await loadProfile();await loadDay();S.backupMsg='Restored '+Object.keys(b.data).length+' records.';
    }catch(e){S.backupMsg='That file is not a GYMBRO backup. Pick a file named gymbro-backup-….json.'}
    render();
  })}
  if(c==='kg'){const id=el.dataset.v;S.day.kg[id]=el.value;saveDay();if(el.value&&S.date>=((S.profile.lifts[id]||{}).date||'')){S.profile.lifts={...S.profile.lifts,[id]:{kg:el.value,date:S.date}};saveProfile()}}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet){S.sheet=null;renderSheet()}if(ev.key==='Enter'&&ev.target.id==='weightIn')actions.saveWeight();if(ev.key==='Enter'&&ev.target.id==='nameIn')actions.saveName()});

/* ---------- boot ---------- */
(async()=>{
  S.profile=Object.assign(blankProfile(),lsGet('profile')||{});
  S.day=Object.assign(blankDay(),lsGet(dayKey(S.date))||{});
  render();
  await initCloud();
  if(Cloud.ready){await loadProfile();await loadDay();render()}
})();
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
