<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GYMBRO demo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GYMBRO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4EEE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#130F11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icon-180.png?v=2">
<link rel="icon" href="../icon-192.png?v=2">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><script>window.GYMBRO_DEMO=true</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app shell — sticky date header, one scrolling view per tab, fixed bottom tab bar.
   Macro colours borrow the Olympic plate code: red 25 kg = protein, blue 20 kg = carbs, yellow 15 kg = fat, green 10 kg = calories. */
:root{
  --bg:#F4EEE3; --surface:#FFFCF7; --surface-2:#EDE4D6; --ink:#24181B; --muted:#6E6265; --line:#E3D8C9;
  --brand:#6E1F2E; --on-brand:#FFF8EE; --brand-soft:#F1E1DF;
  --prot:#C93434; --carb:#1E5BCB; --fat:#B9850A; --kcal:#1C8447; --on-ink:#FFFFFF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F11; --surface:#1D181A; --surface-2:#2A2326; --ink:#F3EDE6; --muted:#A99EA1; --line:#362D31;
  --brand:#C9506A; --on-brand:#FFF8F2; --brand-soft:#3A2129;
  --prot:#F0625E; --carb:#6593F2; --fat:#F0C23F; --kcal:#3FBE73; --on-ink:#130F11; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F11; --surface:#1D181A; --surface-2:#2A2326; --ink:#F3EDE6; --muted:#A99EA1; --line:#362D31;
  --brand:#C9506A; --on-brand:#FFF8F2; --brand-soft:#3A2129;
  --prot:#F0625E; --carb:#6593F2; --fat:#F0C23F; --kcal:#3FBE73; --on-ink:#130F11; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--carb);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:10px;flex:none;display:block;box-shadow:0 0 0 1px var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.12em;color:var(--muted)}
.datenav{margin-left:auto;display:flex;align-items:center;gap:4px}
.datenav button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
.datenav .d{min-width:104px;text-align:center;font-weight:600;font-size:14px;line-height:1.1}
.datenav .d small{display:block;font-weight:500;font-size:11px;color:var(--muted)}

main{display:grid;gap:14px;padding-top:14px}
h2{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:6px 0 0;text-wrap:balance;line-height:1.05}
h3{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
p{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--kcal) 18%,transparent);color:var(--kcal)}
.chip.warn{background:color-mix(in srgb,var(--fat) 22%,transparent);color:color-mix(in srgb,var(--fat) 70%,var(--ink))}
.chip.bad{background:color-mix(in srgb,var(--prot) 16%,transparent);color:var(--prot)}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
input[type=text],input[type=number],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-width:0}
input[type=number]{-moz-appearance:textfield}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}

/* today hero */
.hero{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:30px;line-height:1}
.ring .c span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.macros{display:grid;gap:9px;min-width:0}
.mac{display:grid;gap:4px}
.mac .row{font-size:13px}
.mac .row b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.plate{width:10px;height:10px;border-radius:50%;flex:none}

.water{display:flex;flex-wrap:wrap;gap:6px}
.water button{width:30px;height:38px;border-radius:7px 7px 10px 10px;border:1.5px solid var(--carb);background:transparent;padding:0}
.water button.on{background:var(--carb)}

.list{display:grid;gap:0}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:600;display:block}
.li .t small{color:var(--muted);font-size:12.5px;display:block}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check.on{background:var(--kcal);border-color:var(--kcal)}
.check.on::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:4px 6px}

.tabs-inline{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs-inline button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px}
.tabs-inline button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}

/* workout */
.ex{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0;padding-top:2px}
.ex .head{display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.ex .head b{font-weight:600}
.ex .meta{font-size:12.5px;color:var(--muted)}
.sets{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.set{min-width:38px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;padding:0 8px}
.set.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.kg{width:86px!important;padding:7px 9px!important;text-align:center}
.tip{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px}
.week{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lift{width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto 84px;gap:10px;align-items:center}
.lift:first-child{border-top:0}
.lift b{font-weight:600;display:block}
.lift small{font-size:12px;color:var(--muted)}
.lift .v{text-align:right;font-weight:700;white-space:nowrap}
.lift .v small{display:block;font-weight:500}
.hist{display:grid;gap:4px;font-size:13px;padding:0 0 10px}
.hist div{display:flex;justify-content:space-between}
.week button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;display:grid;gap:1px;justify-items:center;min-width:0}
.week button b{font-size:12px}
.week button span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.week button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.week button.on span{color:inherit;opacity:.75}
.week button.today{box-shadow:inset 0 -3px 0 var(--fat)}

/* demos & videos */
.demo{position:relative;aspect-ratio:3/2;max-width:100%;border-radius:10px;overflow:hidden;background:#101317}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img+img{animation:flip 1.8s linear infinite}
@keyframes flip{0%,48%{opacity:0}52%,96%{opacity:1}100%{opacity:0}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.vitem{display:grid;gap:6px;align-content:start;min-width:0}
.vitem b{font-weight:600;font-size:14px;line-height:1.25}
.vitem small{font-size:12px;color:var(--muted)}
.vlink{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--carb);text-decoration:none;padding:4px 0}
.vlink svg{width:16px;height:16px;flex:none}
.noimg{aspect-ratio:3/2;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600;text-align:center;padding:8px}
.demo-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12px;font-weight:600;padding:3px 8px;flex:none}

/* photos, measurements, timer */
.ptiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ptile{position:relative;display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.ptile img,.padd{width:100%;aspect-ratio:3/4;border-radius:10px;object-fit:cover;display:grid;place-items:center}
.padd{border:1.5px dashed var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.pdel{position:absolute;top:4px;right:4px;background:rgb(0 0 0 / .55);color:#fff;border-radius:8px;width:28px;height:28px;padding:0}
.pcmp{margin:0;display:grid;gap:4px;min-width:0}
.pcmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px}
.pcmp figcaption{font-size:12px;font-weight:600;text-align:center}
.pthumbs{display:flex;gap:4px}
.pthumbs img{width:34px;height:44px;object-fit:cover;border-radius:6px}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px 6px 0}
.mtable td{padding:8px 8px 8px 0;border-top:1px solid var(--line)}
.timer{position:fixed;z-index:26;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:var(--brand);color:var(--on-brand);border-radius:16px;padding:10px 10px 14px 14px;display:flex;align-items:center;gap:8px;overflow:hidden;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.timer.go{background:var(--kcal);color:#fff}
.timer .tl{flex:1;min-width:0;display:grid}
.timer .tl b{font-family:var(--display);font-size:30px;line-height:1}
.timer .tl small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer button{border:0;border-radius:10px;background:rgb(255 255 255 / .16);color:inherit;font-weight:700;font-size:13px;padding:9px 10px}
.timer i{position:absolute;left:0;bottom:0;height:4px;background:var(--fat)}
body.timing .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}

/* coach, streaks */
.coach{display:grid;gap:1px;border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:13px}
.coach b{font-size:14px}
.coach span{color:var(--muted);font-size:12.5px}
.coach.up{background:color-mix(in srgb,var(--kcal) 15%,transparent)}
.coach.up b{color:var(--kcal)}
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.streak{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:0;min-width:0}
.streak b{font-family:var(--display);font-size:30px;line-height:1}
.streak span{font-size:12px;font-weight:600}
.streak small{font-size:11px;color:var(--muted)}
.streak.done{border-color:var(--kcal)}
.streak.done small{color:var(--kcal);font-weight:600}

/* food */
.meal{display:grid;gap:6px}
.meal .mh{display:flex;align-items:baseline;gap:8px}
.meal .mh h3{font-size:17px}
.meal .mh .k{margin-left:auto;font-weight:600;font-size:13px}
.plan-hint{font-size:12.5px;color:var(--muted)}
.mm{font-size:12px;color:var(--muted);white-space:nowrap}
.mm i{font-style:normal;font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88%;border-radius:18px 18px 0 0;display:grid;grid-template-rows:auto auto 1fr;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .sh{padding:14px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.sheet .sb{overflow-y:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.food-pick{width:100%;text-align:left;border:0;background:transparent;padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.food-pick .t{flex:1;min-width:0}
.food-pick b{display:block;font-weight:600}
.food-pick small{color:var(--muted);font-size:12.5px}
.food-pick .k{font-weight:700}
.qty{display:flex;align-items:center;gap:8px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa-b{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:1px}
.qa-b b{font-weight:700;font-size:14px}
.qa-b small{font-size:11.5px;color:var(--muted)}
.scanv{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:#000}
.aiimg{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.btn[disabled]{opacity:.45}
.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600}
.qty input{width:80px!important;text-align:center}

/* progress */
.chart{width:100%;height:auto;display:block}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--display);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.callout{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:5px}

/* target muscles & exercise editor */
.mus{display:flex;gap:10px;align-items:center;min-width:0}
.mpic{flex:none;width:70px;aspect-ratio:3/4;border:0;padding:0;border-radius:9px;overflow:hidden;background:#0d0f12}
.mpic img{width:100%;height:100%;object-fit:cover;display:block}
.mus .mt{min-width:0;display:grid;gap:1px}
.mus .mt b{font-weight:600;font-size:13.5px}
.mus .mt span{color:var(--muted);font-size:12.5px}
.mus .mt small{color:var(--muted);font-size:11.5px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.mgrid figure{margin:0;display:grid;gap:4px}
.mgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:#0d0f12;display:block}
.mgrid figcaption{font-size:12px;font-weight:600;text-align:center}
.edrow{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.edrow .t{flex:1;min-width:0}
.edrow .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.edrow .t small{color:var(--muted);font-size:12.5px;display:block}
.edwrap:first-child .edrow{border-top:0}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0;flex:none;font-size:15px;font-weight:700;display:grid;place-items:center}
.ib[disabled]{opacity:.3}
.edform{display:grid;gap:10px;padding:2px 0 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600}
.mchips button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font:inherit;color:inherit;min-height:64px;resize:vertical}
.tgl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.tgl input{width:20px;height:20px;accent-color:var(--kcal)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px}
/* library & coach */
.lrow{border-top:1px solid var(--line);padding:10px 0;display:grid;gap:8px}
.lrow:first-child{border-top:0}
.lhead{display:flex;align-items:center;gap:10px;min-width:0}
.rk{font-family:var(--display);font-weight:700;font-size:20px;width:26px;flex:none;text-align:center;color:var(--muted)}
.rk.top{color:var(--fat)}
.lthumb{width:64px;height:48px;flex:none;border:0;padding:0;border-radius:8px;overflow:hidden;background:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block}
.lhead .t{flex:1;min-width:0;display:grid}
.lhead .t b{font-weight:600;font-size:14px;line-height:1.25}
.lhead .t small{color:var(--muted);font-size:12px}
.lgpic{width:44px;height:58px;object-fit:cover;border-radius:8px;background:#0d0f12;flex:none}
.coach-cta{background:linear-gradient(135deg,color-mix(in srgb,var(--prot) 14%,var(--surface)),var(--surface) 70%)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps4 i{height:4px;border-radius:9px;background:var(--surface-2)}
.steps4 i.on{background:var(--prot)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--surface-2);border-top-color:var(--prot);margin:6px auto 0;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.prio{width:42px;height:56px;object-fit:cover;border-radius:8px;background:#0d0f12;flex:none}
.vol{display:grid;gap:7px}
.vrow{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font-size:13px}
.vbar{position:relative;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.vbar .zone{position:absolute;left:40%;width:40%;top:0;bottom:0;background:color-mix(in srgb,var(--kcal) 22%,transparent)}
.vbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--prot)}
.vrow b{text-align:right}
.cex{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.cex small{color:var(--muted);font-size:12.5px}
.cex .tip{margin-top:4px}
/* app shell polish */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.dayno{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.dayno.on{background:var(--brand);color:var(--on-brand)}
.li.menu{width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;padding:14px 0}
.chev{font-size:24px;color:var(--muted);line-height:1}
.card{box-shadow:0 1px 2px rgb(40 20 25 / .04)}
h2,h3{color:var(--ink)}
.eyebrow{color:var(--brand)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:4px 0;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.02em;min-width:0}
nav.tabbar button svg{width:22px;height:22px}
nav.tabbar button.on{color:var(--brand)}
nav.tabbar button.on svg{stroke-width:2.2}
img.broken{visibility:hidden;background:var(--surface-2)}
#ghCard{scroll-margin-top:90px}
.sync{font-size:11px;color:var(--muted);text-align:center;padding-top:4px}
@media (max-width:380px){.hero{grid-template-columns:1fr;justify-items:center}.macros{width:100%}.stats{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.demo img+img{animation:none;opacity:0}}
</style>

const LS=DEMO?'gymbrodemo:':'gymbro:';
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}};
const Cloud={db:null,uid:null,ready:false,err:false,why:'',moved:0};
const timers={},chains={},latest={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function initCloud(){
  for(let i=0;i<20&&!(window.claude&&window.claude.use);i++)await sleep(100);
  if(!(window.claude&&window.claude.use)){Cloud.why='nohost';return}
  try{
    const to=()=>new Promise(r=>setTimeout(()=>r(null),10000));
    const[db,user]=await Promise.all([Promise.race([window.claude.use('db'),to()]),Promise.race([window.claude.use('user'),to()])]);
    const id=user?await Promise.race([user.id(),to()]):null;
    if(db&&id){Cloud.db=db;Cloud.uid=id;Cloud.ready=true}else Cloud.why=!db?'nodb':'nouser';
  }catch(e){Cloud.why='error'}
}
const localKeys=()=>{const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS)&&k!==LS+'tab')ks.push(k.slice(LS.length))}}catch(e){}return ks};
// Older versions often ran where the account was not reachable, so progress stayed on the phone.
// Copy every record this device holds into the account once, without overwriting anything already there.
async function migrateLocal(){
  if(!Cloud.ready)return;
  const ks=localKeys();let n=0;
  for(const k of ks){
    try{const snap=await ref(k).get();const v=lsGet(k);if(v==null)continue;
      if(!snap.exists){await ref(k).set(v);n++}
      else{const c=JSON.parse(JSON.stringify(snap.data()||{})),m=mergeRecord(k,v,c);if(JSON.stringify(m)!==JSON.stringify(c)){await ref(k).set(m);lsSet(k,m);n++}}
    }catch(e){}
  }
  Cloud.moved=n;
}
const ref=k=>Cloud.db.doc('data/users/'+Cloud.uid+'/'+k);
async function load(k){
  const local=lsGet(k);
  if(!Cloud.ready)return local;
  try{
    const snap=await ref(k).get();
    if(snap.exists){const d=JSON.parse(JSON.stringify(snap.data()));lsSet(k,d);return d}
    if(local)save(k,local);
    return local;
  }catch(e){return local}
}
function save(k,v){
  latest[k]=v;lsSet(k,v);ghQueue();
  if(!Cloud.ready)return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{
    chains[k]=(chains[k]||Promise.resolve()).then(()=>ref(k).set(latest[k])).then(()=>{Cloud.err=false;renderSync()}).catch(()=>{Cloud.err=true;renderSync()});
  },700);
}
function renderSync(){$('#sync').textContent=(Cloud.ready?(Cloud.err?'Could not sync the last change. It is saved on this device.':'Synced to your Claude account'):(Cloud.why==='nohost'?ghStatus():'Not connected to your Claude account · saved on this device only'))+' · '+APP_VERSION}

/* ---------- next-weight coach (double progression) ---------- */
const SMALL_LIFTS=new Set(['latr','latr2','fpull','curl','hammer','incurl','kitty','push','pdeck','lext','slext','slcurl','llcurl','abduct','scalf','lpcalf','neck','pallof','sllp','jmp','dips']);
function repRange(r){const m=String(r).match(/(\d+)(?:–(\d+))?/);return m?{lo:+m[1],hi:+(m[2]||m[1])}:null}
function lastLift(id,date){const h=(S.profile.liftLog||{})[id]||{};const d=Object.keys(h).filter(x=>x<date).sort().pop();return d?{...h[d],date:d}:null}
function nextTarget(e,date){
  const last=lastLift(e.id,date),rr=repRange(e.r);if(!last||!rr)return null;
  const inc=SMALL_LIFTS.has(e.id)?1:2.5;
  if(last.reps&&last.reps>=rr.hi)return{kg:r1(last.kg+inc),why:`You hit ${last.reps} reps last time. Go up ${inc} kg.`,up:true};
  if(last.reps&&last.reps<rr.lo)return{kg:last.kg,why:`Stay here until you get ${rr.lo}+ reps.`};
  return{kg:last.kg,why:last.reps?`Same weight, beat ${last.reps} reps.`:'Same weight. Log reps so the coach can move you up.'};
}

/* ---------- protein helper ---------- */
const PROT_OPTS=[['whey',1],['gyog',2],['tuna',1],['chicken',1.5],['cottage',2],['egg',3],['casein',1],['protbar',1],['laban',1]];
function proteinIdeas(need){
  const night=new Date().getHours()>=21,opts=PROT_OPTS.filter(([id])=>night?id!=='protbar':id!=='casein'),combos=[];
  opts.forEach((a,i)=>{combos.push([a]);opts.slice(i+1).forEach(b=>combos.push([a,b]))});
  return combos.map(c=>({c,s:sumItems(c)})).filter(x=>x.s.p>=need*0.85&&x.s.p<=need+25)
    .sort((x,y)=>(Math.abs(x.s.p-need)+x.c.length*6+x.s.k/60)-(Math.abs(y.s.p-need)+y.c.length*6+y.s.k/60)).slice(0,3);
}
function viewProteinHelper(){

  const ideas=need<=80?proteinIdeas(need):[];
  return `<section class="card"><div class="row between"><h3>Protein: ${need} g to go</h3><span class="chip warn">helper</span></div>
    ${ideas.length?`<div class="list">${ideas.map(x=>`<div class="li"><div class="t"><b>${x.c.map(label).map(esc).join(' + ')}</b><small class="num">${r0(x.s.p)} g protein · ${r0(x.s.k)} kcal</small></div><button class="btn ghost sm" data-a="logIdea" data-v="${x.c.map(([id,q])=>id+':'+q).join(',')}">Log</button></div>`).join('')}</div>`

/* ---------- day cache, streaks and the cycle report ---------- */
async function getDay(d){if(d===S.date)return S.day;if(!S.dayCache[d])S.dayCache[d]=Object.assign(blankDay(),await load(dayKey(d))||{});return S.dayCache[d]}
const CHECKS={
  protein:(d,day)=>totals(day.foods).p>=targets(d).p*0.9,
  water:(d,day)=>(day.water||0)>=13,
  train:(d,day)=>{if(dayPlan(d).type!=='train')return true;const wp=workoutProgress(d,day);return wp.total>0&&wp.done>=wp.total*0.5},
};
async function computeStreaks(){
  if(TODAY<START){S.streaks=null;return}
  const res={},tday=await getDay(TODAY);
  for(const k of Object.keys(CHECKS)){
    let n=0,d=addDays(TODAY,-1);
    while(d>=START&&n<400){if(!CHECKS[k](d,await getDay(d)))break;n++;d=addDays(d,-1)}
    const t=CHECKS[k](TODAY,tday);res[k]={n:n+(t?1:0),today:t};
  }
  S.streaks=res;
}
let streakT;
function scheduleStreaks(){clearTimeout(streakT);streakT=setTimeout(async()=>{await computeStreaks();if(S.tab==='today'&&!S.sheet)render()},400)}
function viewStreaks(){
  if(S.date!==TODAY||!S.streaks)return '';
  const tile=(k,n)=>{const s=S.streaks[k];return `<div class="streak ${s.today?'done':''}"><b class="num">${s.n}</b><span>${n}</span><small>${s.today?'today done':'today to do'}</small></div>`};
  return `<section class="streaks" aria-label="Streaks in days">${tile('protein','Protein days')}${tile('train','Training on plan')}${tile('water','Water days')}</section>`;
}
const cycleStartOf=d=>d<START?START:addDays(d,-cycleIdx(d));
async function buildReport(start){
  const days=[...Array(CYCLE.length)].map((_,i)=>addDays(start,i)).filter(d=>d<=TODAY);
  const rows=[];for(const d of days)rows.push({d,day:await getDay(d)});
  const logged=rows.filter(r=>r.day.foods.length);
  const kc=logged.map(r=>totals(r.day.foods).k),tg=logged.map(r=>targets(r.d).kcal);
  const trainDays=rows.filter(r=>dayPlan(r.d).type==='train');
  const w=S.profile.weights,wd=Object.keys(w).filter(d=>d>=start&&d<=addDays(start,CYCLE.length-1)).sort();
  const prs=[];const log=S.profile.liftLog||{};
  Object.keys(log).forEach(id=>{const h=log[id],ds=Object.keys(h).sort();let best=0;ds.forEach(d=>{const v=e1rm(h[d]);if(v>best){if(d>=start&&d<=addDays(start,CYCLE.length-1)&&best>0)prs.push(id);best=v}})});
  return{start,days:rows.length,logged:logged.length,
    avgK:logged.length?r0(kc.reduce((a,b)=>a+b,0)/logged.length):0,avgT:logged.length?r0(tg.reduce((a,b)=>a+b,0)/logged.length):0,
    protein:rows.filter(r=>CHECKS.protein(r.d,r.day)).length,water:rows.filter(r=>CHECKS.water(r.d,r.day)).length,
    workouts:trainDays.filter(r=>CHECKS.train(r.d,r.day)).length,trainDays:trainDays.length,
    wFrom:wd.length?w[wd[0]]:null,wTo:wd.length?w[wd[wd.length-1]]:null,prs:[...new Set(prs)]};
}
function viewReport(){
  const cur=cycleStartOf(TODAY),sel=S.repStart||cur,prev=addDays(cur,-CYCLE.length);
  if(!S.repData||S.repData.start!==sel){buildReport(sel).then(r=>{S.repData=r;if(S.tab==='progress'&&S.progSub==='report')render()});return `<section class="card"><p class="muted">Building your report…</p></section>`}

async function moveDay(src,target){

  if(!to.sleep)to.sleep=from.sleep;
  save(dayKey(target),to);save(dayKey(src),blankDay());S.dayCache[target]=to;S.dayCache[src]=blankDay();S.repData=null;scheduleStreaks();

  const log={...(pr.liftLog||{})};Object.keys(log).forEach(id=>{const h={...log[id]};if(h[src]&&!h[target]){h[target]=h[src];delete h[src];log[id]=h}});pr.liftLog=log;

function spark(vals){

function weightStats(){
  const w=S.profile.weights,dates=Object.keys(w).sort();
  const latestD=dates[dates.length-1],latestW=w[latestD];
  const recent=dates.filter(d=>d>=addDays(latestD,-27));
  let rate=null;
  if(recent.length>=3){
    const t0=parse(recent[0]).getTime(),xs=recent.map(d=>(parse(d).getTime()-t0)/864e5/7),ys=recent.map(d=>w[d]);
    const n=xs.length,mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
    const den=xs.reduce((a,x)=>a+(x-mx)**2,0);
    if(den>0&&xs[n-1]>=1)rate=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/den;
  }
  const wk=dates.filter(d=>d>addDays(latestD,-7)).map(d=>w[d]);
  const avg7=wk.reduce((a,b)=>a+b,0)/wk.length;
  return{dates,latestD,latestW,rate,avg7};
}
function chart(){
  const w=S.profile.weights,dates=Object.keys(w).sort();
  const W=600,H=230,L=40,R=14,T=14,B=30;
  const t0=parse(dates[0]).getTime(),t1=Math.max(parse(dates[dates.length-1]).getTime(),t0+7*864e5);
  const vals=dates.map(d=>w[d]);
  const lo=Math.floor(Math.min(...vals,REPORT.weight)-1),hi=Math.ceil(Math.max(...vals,GOAL.weight)+0.5);
  const x=d=>L+(parse(d).getTime()-t0)/(t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const step=hi-lo>8?2:1;let grid='';
  for(let v=lo;v<=hi;v+=step)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const pts=dates.map(d=>[x(d),y(w[d])]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=pts.length>1?line+` L${pts[pts.length-1][0].toFixed(1)} ${H-B} L${pts[0][0].toFixed(1)} ${H-B} Z`:'';
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight over time">
    ${grid}
    <line x1="${L}" x2="${W-R}" y1="${y(GOAL.weight)}" y2="${y(GOAL.weight)}" stroke="var(--kcal)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-R}" y="${y(GOAL.weight)-6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--kcal)">Goal ${GOAL.weight} kg</text>
    ${area?`<path d="${area}" fill="var(--carb)" fill-opacity=".10"/>`:''}
    <path d="${line}" fill="none" stroke="var(--carb)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--carb)"/>`).join('')}
    <circle cx="${last[0]}" cy="${last[1]}" r="5" fill="var(--surface)" stroke="var(--carb)" stroke-width="2.5"/>
    <text x="${L}" y="${H-10}" font-size="11" fill="var(--muted)">${fmtDate(dates[0])}</text>
    <text x="${W-R}" y="${H-10}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDate(ymd(new Date(t1)))}</text>
  </svg>`;
}

async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
  }finally{URL.revokeObjectURL(url)}
}

const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)});
function offToFood(p){
  const n=p.nutriments||{},k=n['energy-kcal_100g']??(n['energy_100g']!=null?n['energy_100g']/4.184:null);
  if(k==null)return null;
  const name=(p.product_name||'Unnamed product').trim(),brand=Array.isArray(p.brands)?p.brands[0]:(p.brands||'').split(',')[0];
  return{id:'off-'+(p.code||uid()),n:name+(brand?' · '+brand.trim():''),u:'100 g',k:r0(k),p:r1(n.proteins_100g||0),c:r1(n.carbohydrates_100g||0),f:r1(n.fat_100g||0),custom:true,src:'off',serving:p.serving_quantity?Number(p.serving_quantity):null};
}
async function getJSON(url){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),15000);try{const r=await fetch(url,{signal:ctl.signal});if(!r.ok&&r.status!==404)throw new Error('http');return await r.json()}finally{clearTimeout(t)}}
async function searchOnline(q){

async function lookupBarcode(code){

/* AI meal photo: Claude estimates items, grams and macros */
const AI_SCHEMA={type:'object',properties:{items:{type:'array',items:{type:'object',properties:{name:{type:'string'},grams:{type:'number'},kcal:{type:'number'},protein:{type:'number'},carbs:{type:'number'},fat:{type:'number'},confidence:{type:'string',enum:['low','medium','high']}},required:['name','grams','kcal','protein','carbs','fat','confidence'],additionalProperties:false}},note:{type:'string'}},required:['items','note'],additionalProperties:false};
const aiPrompt=note=>`You estimate nutrition from a meal photo for a man on a lean bulk in the UAE.
List every distinct food and drink you can see as a separate item. Estimate each portion in grams (ml for drinks) from visual cues such as plate size (about 27 cm), cutlery, hands and packaging. Give calories, protein, carbs and fat for that portion, including visible oil, butter, sauces and dressings. When a dish looks like a typical UAE or Middle Eastern restaurant dish (machboos, mandi, shawarma, mixed grill and so on), use typical restaurant preparation. If you can read a nutrition label or a packaged product, use its numbers. Set confidence per item. In "note", say in one or two short sentences what you assumed (for example hidden oil, portion size) or why there are no items if the photo is not food.${note?`\nThe user adds: "${note.slice(0,900)}"`:''}`;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
// Outside the Claude app (the home-screen version) the coach runs on the user's own API key, shaped like sample.json.
function keySample(){
  const f=async(input,opts={})=>{
    const {default:Anthropic}=await import(SDK_URL).catch(()=>{throw{msg:'The AI Coach needs internet. Connect and try again.'}});
    const client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});
    const content=[];for(const b of opts.images||[])content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobToB64(b)}});
    content.push({type:'text',text:input+'\n\nReply with the JSON object only, no other text.'});
    let text='';
    try{
      const st=client.messages.stream({model:'claude-opus-5-5',max_tokens:32000,messages:[{role:'user',content}]});
      st.on('text',d=>{text+=d;opts.onText&&opts.onText({text,delta:d})});
      await st.finalMessage();
    }catch(e){
      if(e instanceof Anthropic.AuthenticationError)throw{msg:'Your API key was rejected. Check it in Food › Scan with AI.'};
      if(e instanceof Anthropic.RateLimitError)throw{msg:'Too many requests right now. Wait a minute and try again.'};
      if(e instanceof Anthropic.APIError&&(e.type==='billing_error'||/credit/i.test(e.message||'')))throw{msg:'Your Anthropic account is out of credit. Add credit at console.anthropic.com → Billing.'};
      throw{msg:'Could not reach the AI service. Check your internet and try again.'};
    }
    const m=text.replace(/```(?:json)?/g,'').match(/\{[\s\S]*\}/);
    try{return JSON.parse(m?m[0]:text)}catch(e){throw{code:'invalid_json'}}
  };
  f.json=f;f.limits=async()=>({images:{maxCount:3}});
  return f;
}
async function aiBackend(){
  if(window.claude&&window.claude.use){try{const s=await window.claude.use('sample');const caps=s&&await s.limits().catch(()=>null);if(caps&&caps.images)return{type:'claude',s}}catch(e){}}
  return getKey()?{type:'key'}:null;
}
async function analyzeMeal(blob,note){
  const be=await aiBackend();
  if(!be)throw{msg:'Add your API key first.',setup:true};
  if(be.type==='claude'){
    try{return await be.s.json(aiPrompt(note)+`\nReply with JSON only: {"items":[{"name":string,"grams":number,"kcal":number,"protein":number,"carbs":number,"fat":number,"confidence":"low"|"medium"|"high"}],"note":string}`,{images:[blob],modelTier:'default',cache:false})}
    catch(e){throw{msg:e&&e.code==='not_granted'?'Allow this page to use Claude, then try again.':e&&e.code==='rate_limited'?'Too many scans in a short time. Wait a minute and try again.':'Claude could not read that photo. Try again or take a clearer picture.'}}
  }
  const {default:Anthropic}=await import(SDK_URL).catch(()=>{throw{msg:'The AI scan needs internet. Connect and try again.'}});
  const client=new Anthropic({apiKey:getKey(),dangerouslyAllowBrowser:true});
  let res;
  try{
    res=await client.beta.messages.create({
      model:'claude-opus-5-5',max_tokens:16000,
      betas:['server-side-fallback-2026-07-01'],fallbacks:'default',
      output_config:{effort:'low',format:{type:'json_schema',schema:AI_SCHEMA}},
      messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:await blobToB64(blob)}},{type:'text',text:aiPrompt(note)}]}],
    });
  }catch(e){
    if(e instanceof Anthropic.AuthenticationError)throw{msg:'Your API key was rejected. Check it in the AI key settings.',setup:true};
    if(e instanceof Anthropic.RateLimitError)throw{msg:'Too many requests right now. Wait a minute and try again.'};
    if(e instanceof Anthropic.APIConnectionError)throw{msg:'Could not reach the AI service. Check your internet and try again.'};
    if(e instanceof Anthropic.APIError)throw{msg:e.type==='billing_error'||/credit/i.test(e.message||'')?'Your Anthropic account is out of credit. Add credit at console.anthropic.com → Billing.':'The AI service returned an error ('+(e.status||'?')+'). Try again.'};
    throw{msg:'Something went wrong. Try again.'};
  }
  if(res.stop_reason==='refusal')throw{msg:'The AI declined this photo. Try a photo of just the food.'};
  if(res.stop_reason==='max_tokens')throw{msg:'The answer was cut off. Try again.'};
  try{return JSON.parse(res.content.filter(b=>b.type==='text').map(b=>b.text).join(''))}catch(e){throw{msg:'The AI answer could not be read. Try again.'}}
}

    const out=await analyzeMeal(blob,note);

  if(S.sheet===sh)renderSheet();
}

// The built-in plan is kept as BASE_BLOCKS; the viewer's edits (profile.planEdits) replace a day's blocks.
const BASE_BLOCKS=Object.fromEntries(Object.keys(PLANS).map(k=>[k,JSON.parse(JSON.stringify(PLANS[k].blocks))]));
const EXBYID={};
const validBlocks=b=>Array.isArray(b)&&b.every(x=>x&&typeof x.t==='string'&&Array.isArray(x.items)&&x.items.every(e=>e&&e.id&&e.n));
const validAiPlan=a=>!!(a&&typeof a.start==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(a.start)&&Array.isArray(a.days)&&a.days.length>=3&&a.days.length<=10&&a.days.every(d=>d&&typeof d.key==='string'&&d.name&&validBlocks(d.blocks)));
const aiActive=()=>validAiPlan(S.profile.aiPlan);
const validMeals=m=>Array.isArray(m)&&m.length>=2&&m.every(x=>x&&typeof x.id==='string'&&x.n&&Array.isArray(x.items)&&x.items.every(it=>Array.isArray(it)&&foodById(it[0])&&it[1]>0));
const AI_BASE={};
function rebuildPlans(){
  if(DEMO)applyDemo();
  const pe=S.profile.planEdits||{};
  // An active AI Coach program replaces the cycle; its days get keys like "ai<id>_<n>", so old edits never leak in.
  Object.keys(PLANS).forEach(k=>{if(AI_BASE[k]){delete PLANS[k];delete AI_BASE[k]}});
  if(aiActive()){
    const ap=S.profile.aiPlan;
    ap.days.forEach(d=>{AI_BASE[d.key]=d.blocks;PLANS[d.key]={name:String(d.name).slice(0,24),sub:String(d.sub||'').slice(0,80),type:d.type==='train'?'train':'rest',blocks:[]}});
    CYCLE=ap.days.map(d=>d.key);START=ap.start;
  }else{CYCLE=BASE_CYCLE.slice();START=DEMO&&S.profile.setup?S.profile.setup.start:BASE_START}
  // The coach's meal plan and calorie targets apply only while its program is active and the viewer chose to use them.
  const am=aiActive()&&S.profile.aiPlan.useMeals&&validMeals(S.profile.aiPlan.meals)?S.profile.aiPlan.meals:null;
  MEALS=am?am:BASE_MEALS;
  ['train','rest'].forEach(t=>Object.assign(TARGET[t],am&&S.profile.aiPlan.targets&&S.profile.aiPlan.targets[t]?S.profile.aiPlan.targets[t]:BASE_TARGET[t]));
  Object.keys(PLANS).forEach(k=>{const base=AI_BASE[k]||BASE_BLOCKS[k];if(!base)return;PLANS[k]={...PLANS[k],blocks:JSON.parse(JSON.stringify(validBlocks(pe[k])?pe[k]:base))}});
  Object.keys(EXBYID).forEach(k=>delete EXBYID[k]);
  Object.values(PLANS).forEach(p=>p.blocks.forEach(b=>b.items.forEach(e=>{if(!EXBYID[e.id])EXBYID[e.id]=e})));
}
rebuildPlans();
const T={end:0,total:0,iv:null,ac:null,done:false};
const mmss=n=>Math.floor(n/60)+':'+pad(n%60);
function restSecs(r){const m=String(r).match(/(\d+)(?:–(\d+))?\s*(min|s)\b/);if(!m)return 0;const v=(+m[1]+(m[2]?+m[2]:+m[1]))/2;return Math.round(m[3]==='min'?v*60:v)}
function startTimer(e){
  const sec=restSecs(e.rest);if(!sec)return;
  if(S.profile.iosTimer)openShortcut(sec);
  try{T.ac=T.ac||new(window.AudioContext||window.webkitAudioContext)();T.ac.resume()}catch(err){}
  T.total=sec;T.end=Date.now()+sec*1000;T.done=false;
  $('#timer').innerHTML=`<div class="timer" role="timer"><div class="tl"><b class="num" id="tLeft"></b><small id="tLabel"></small></div><button data-a="tAdd" data-v="-15" aria-label="15 seconds less">−15</button><button data-a="tAdd" data-v="15" aria-label="15 seconds more">+15</button><button data-a="tStop">Skip</button><i id="tBar"></i></div>`;
  T.label=e.n;document.body.classList.add('timing');
  clearInterval(T.iv);T.iv=setInterval(tick,250);tick();
}
function tick(){
  if(!T.end)return;
  const left=Math.ceil((T.end-Date.now())/1000),box=$('#timer .timer');if(!box)return;
  if(left<=0&&!T.done){T.done=true;beep();box.classList.add('go')}
  if(left<=-10){stopTimer();return}
  $('#tLeft').textContent=left>0?mmss(left):'Go!';
  $('#tLabel').textContent=(left>0?'Rest · ':'Next set · ')+T.label;
  $('#tBar').style.width=Math.max(0,left)/T.total*100+'%';
}
function stopTimer(){clearInterval(T.iv);T.end=0;$('#timer').innerHTML='';document.body.classList.remove('timing')}
function beep(){
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  const ac=T.ac;if(!ac)return;
  [0,0.25,0.5].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.4,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);o.start(s);o.stop(s+0.2)});
}

function suggestMeal(){

  if(isRamadan(S.date)){if(S.date!==TODAY)return 'iftar';return h<5?'suhoor':h<19?'iftar':h<21?'main':h<22?(type==='train'?'rpre':'late'):h<23?(type==='train'?'rpost':'late'):'late'}

}

    await ghApi('/user',{},token);
    let gist=null;
    for(let page=1;page<=5&&!gist;page++){const list=await ghApi('/gists?per_page=100&page='+page,{},token);gist=list.find(g=>g.files&&g.files[GH_FILE]);if(list.length<100)break}
    let pulled=0;
    if(gist){ghSet({token,gist:gist.id});pulled=await ghFill(await ghRead(await ghApi('/gists/'+gist.id)))}
    else{const g=await ghApi('/gists',{method:'POST',body:JSON.stringify({description:'GYMBRO backup (private, updated automatically)',public:false,files:{[GH_FILE]:{content:JSON.stringify(backupObj())}}})},token);ghSet({token,gist:g.id,last:Date.now(),err:''})}
    await ghPush();
    return 'Automatic backup is on.'+(pulled?` ${pulled} records were restored from your backup.`:'');
  }catch(e){return e&&e.status===401?'GitHub rejected that token. Make a new one and paste it again.':e&&e.status===403||e&&e.status===404?'That token cannot make gists. Tick the "gist" box when you create it.':'Could not reach GitHub. Check your internet and try again.'}
}
let ghT=null,ghBusy=false,ghAgain=false;
function ghQueue(){if(!ghCfg())return;clearTimeout(ghT);ghT=setTimeout(ghPush,6000)}
async function ghPush(){
  const c=ghCfg();if(!c||!c.gist)return;
  clearTimeout(ghT);if(ghBusy){ghAgain=true;return}ghBusy=true;
  try{await ghApi('/gists/'+c.gist,{method:'PATCH',body:JSON.stringify({files:{[GH_FILE]:{content:JSON.stringify(backupObj())}}})});ghSet({last:Date.now(),err:''})}
  catch(e){ghSet({err:e&&e.status===401?'token':e&&e.status===404?'gone':'net'})}
  ghBusy=false;renderSync();
  if(ghAgain){ghAgain=false;ghPush()}
}
function ghStatus(){
  const c=ghCfg();if(!c)return 'Saved on this phone only · backup is off';
  if(c.err)return c.err==='token'?'Backup paused: GitHub token expired. Fix it in More › About & data':c.err==='gone'?'Backup paused: backup file missing. Reconnect in More › About & data':'Saved on this phone · backup will retry when online';
  if(!c.last)return 'Backing up…';
  const m=Math.round((Date.now()-c.last)/60000);
  return 'Backed up to GitHub '+(m<1?'just now':m<60?m+' min ago':new Date(c.last).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}));
}
function viewGhBackup(){

  if(c&&c.gist)return `<section class="card" id="ghCard"><h3>Automatic backup</h3><p style="font-size:13.5px">${esc(ghStatus())}.</p>
    <p class="muted" style="font-size:12.5px">Every change you make is copied to a private file on your GitHub a few seconds later, and GitHub keeps every earlier version. If you lose this phone or delete the icon, connect again with a token and everything comes back.</p>${msg}
    <div class="row" style="gap:8px"><button class="btn sm" data-a="ghNow">Back up now</button><a class="btn ghost sm" href="https://gist.github.com/${esc(c.gist)}" target="_blank" rel="noopener">View on GitHub</a><button class="btn ghost sm" data-a="ghOff">Turn off</button></div></section>`;

    ${msg}<p class="muted" style="font-size:12px">If you set GYMBRO up again on a new phone, use the same steps and your data is restored automatically.</p></section>`;
}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&ghT)ghPush()});
setInterval(()=>{if(ghCfg())renderSync()},60000);

/* ---------- one-time fill: the days lost when the old app was deleted, marked fully done ---------- */
const FILL_FROM='2026-11-08',FILL_TO='2026-11-12',FILL_FLAG='gymbro-filled-2026-11-08';
async function fillPastDays(){
  if(DEMO)return;
  try{if(localStorage.getItem(FILL_FLAG))return}catch(e){return}
  for(let d=FILL_FROM;d<=FILL_TO;d=addDays(d,1)){
    const cur=await load(dayKey(d));if(dayHas(cur))continue;
    const type=dayType(d),day=blankDay();
    mealsFor(d).forEach(m=>mealItems(m,type).forEach(([id,q])=>{const f=foodById(id);if(f)day.foods.push(entryFrom(f,q,m.id,true))}));
    dayPlan(d).blocks.forEach(b=>b.items.forEach(e=>{day.sets[e.id]=Array(e.s).fill(true)}));
    ROUTINE.forEach(([k])=>day.routine[k]=true);HABITS.forEach(([k])=>day.habits[k]=true);
    day.supps={creatine:true,mag:true};day.water=14;
    save(dayKey(d),day);
  }
  try{localStorage.setItem(FILL_FLAG,'1')}catch(e){}
  S.dayCache={};S.repData=null;await loadDay();
}

/* ---------- demo: first-time setup and personal targets ---------- */
const BASE_MEALS0=JSON.parse(JSON.stringify(BASE_MEALS)),BASE_TARGET0=JSON.parse(JSON.stringify(BASE_TARGET));
const DGOALS=[['bulk','Build muscle','Lean bulk, about +300 kcal'],['cut','Lose fat','Keep muscle, about −450 kcal'],['maintain','Recomp','Same weight, more muscle']];
function demoCalc(u){
  const bmr=Math.round(10*u.weight+6.25*u.height-5*u.age+(u.sex==='f'?-161:5));
  const tee=Math.round(bmr*1.5),adj={bulk:300,cut:-450,maintain:0}[u.goal];
  const t=(kcal,pk,fk)=>{const p=Math.round(u.weight*pk),f=Math.round(u.weight*fk);return{kcal,p,c:Math.max(60,Math.round((kcal-p*4-f*9)/4)),f}};
  const rest=Math.round((tee+adj-100)/10)*10,train=rest+300,pk=u.goal==='cut'?2.3:2.0;
  return{bmr,tee,train:t(train,pk,0.9),rest:t(rest,pk-0.1,1.0)};
}
function applyDemo(){
  const u=S.profile.setup;if(!u)return;
  const c=demoCalc(u),h=u.height/100;
  Object.assign(REPORT,{date:u.start,age:u.age,height:u.height,weight:u.weight,bmr:c.bmr,tee:c.tee,bmi:r1(u.weight/(h*h)),stdWeight:r1(22*h*h)});
  Object.assign(GOAL,{weight:u.goalWeight,stretch:u.goalWeight,dir:u.goal==='bulk'?1:u.goal==='cut'?-1:0,rateLo:u.goal==='cut'?0.4:0.25,rateHi:u.goal==='cut'?0.8:0.35});
  BASE_TARGET.train={...c.train};BASE_TARGET.rest={...c.rest};
  // Scale the starter meal plan to their calories (to the nearest quarter serving; salad and vegetables stay as they are).
  const planK=ty=>BASE_MEALS0.reduce((a,m)=>a+mealItems(m,ty).reduce((x,[id,q])=>x+(foodById(id)||{k:0}).k*q,0),0);
  const k=(c.train.kcal/planK('train')+c.rest.kcal/planK('rest'))/2;
  const sc=([id,q])=>[id,/^(salad|veg)$/.test(id)?q:Math.max(0.25,Math.round(q*k*4)/4)];
  BASE_MEALS.forEach((m,i)=>{const o=BASE_MEALS0[i];m.items=o.items.map(sc);if(o.restExtra)m.restExtra=o.restExtra.map(sc)});
  const b=document.querySelector('.brand small');if(b)b.textContent=(lbl(DGOALS,u.goal)+' · '+u.height+' cm').toUpperCase();
}

  const u=S.setupDraft||(S.setupDraft={...(S.profile.setup||{name:'',sex:'m',age:'',height:'',weight:'',goal:'bulk',days:4,goalWeight:''})});

  const num=(k,label,ph,step)=>`<label class="f">${label}<input type="number" inputmode="decimal" step="${step||1}" data-c="setupIn" data-k="${k}" value="${esc(u[k]??'')}" placeholder="${ph}"></label>`;
  return `<section class="card"><div class="row"><img src="${LOGO}" alt="" width="56" height="56" style="border-radius:14px"><div><div class="eyebrow">Welcome to GYMBRO</div><h2 style="margin:0">${S.profile.setup?'Your stats':'Set up in 1 minute'}</h2></div></div>
    <p class="muted" style="font-size:13px">Your calories, macros, meal plan and progress tracking are built from this. Everything stays on your phone.</p></section>
  <section class="card">
    <label class="f">First name<input type="text" data-c="setupIn" data-k="name" value="${esc(u.name||'')}" placeholder="e.g. Ahmed" autocomplete="given-name"></label>
    <div class="f">Sex<div class="mchips">${opt('sex','m','Male')}${opt('sex','f','Female')}</div></div>
    <div class="grid2" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${num('age','Age','25')}${num('height','Height cm','178')}${num('weight','Weight kg','72',0.1)}</div>
    <div class="f">Goal<div class="mchips">${DGOALS.map(([v,n,d])=>opt('goal',v,n,d)).join('')}</div></div>
    <div class="f">Training days per week <span class="muted" style="font-size:12px">(the AI Coach builds around this)</span><div class="mchips">${[3,4,5,6].map(d=>opt('days',d,d+' days')).join('')}</div></div>
    ${num('goalWeight','Goal weight kg (optional)','we suggest one',0.1)}

    <div class="row">${S.profile.setup?'<button class="btn ghost" data-a="setupCancel">Cancel</button>':''}<button class="btn" style="flex:1" data-a="setupSave">${S.profile.setup?'Save':'Build my plan'}</button></div>
  </section>`;
}
function demoScan(){
  const u=S.profile.setup;if(!u)return '';const c=demoCalc(u);
  return `<section class="card"><div class="eyebrow">Your starting point · ${fmtDate(u.start)}</div><h3>Where you started</h3>

    <div class="stat"><b class="num">${c.bmr}</b><span>BMR kcal (at rest)</span></div><div class="stat"><b class="num">${c.tee}</b><span>Est. burn kcal/day</span></div><div class="stat"><b class="num">${TARGET.train.p}</b><span>Protein g/day</span></div></div>

    <button class="btn ghost sm" data-a="setupEdit">Edit my stats</button></section>`;
}
Object.assign(actions,{
  setupSet(v,el){S.setupDraft[el.dataset.k]=el.dataset.k==='days'?+v:v;S.setupErr='';render()},
  setupEdit(){S.setupDraft=null;S.editSetup=true;render();window.scrollTo(0,0)},

    const u=S.setupDraft,n=k=>parseFloat(u[k]);

    S.profile.setup={name:String(u.name||'').trim().slice(0,30),sex:u.sex,age,height,weight,goal:u.goal,days:u.days,goalWeight:gw,start:first?TODAY:S.profile.setup.start};
    if(S.profile.setup.name)S.profile.name=S.profile.setup.name;
    if(first){S.profile.weights={[TODAY]:weight}}
    S.setupDraft=null;S.editSetup=false;S.setupErr='';rebuildPlans();saveProfile();S.tab='today';render();window.scrollTo(0,0);
  },
});

/* ---------- move data between devices ---------- */
function backupObj(){const out={app:'gymbro',version:1,exported:new Date().toISOString(),data:{}};localKeys().forEach(k=>{const v=lsGet(k);if(v!=null)out.data[k]=v});return out}
const dayHas=d=>!!d&&((d.foods&&d.foods.length)||Object.keys(d.sets||{}).length||d.water||Object.keys(d.kg||{}).length);
// Merge instead of replace, so pasting old data never wipes anything logged here.
function mergeRecord(k,inc,cur){
  if(cur==null)return inc;
  if(k.startsWith('day-'))return dayHas(cur)&&!dayHas(inc)?cur:dayHas(inc)&&!dayHas(cur)?inc:{...inc,...cur,foods:[...(cur.foods||[]),...(inc.foods||[]).filter(f=>!(cur.foods||[]).some(g=>g.id===f.id))],sets:{...inc.sets,...cur.sets},kg:{...inc.kg,...cur.kg},reps:{...inc.reps,...cur.reps},water:Math.max(cur.water||0,inc.water||0)};
  if(k==='profile'){const o={...inc,...cur};['weights','lifts','liftLog','grocery','planEdits','measures'].forEach(f=>{if(inc[f]&&typeof inc[f]==='object'&&!Array.isArray(inc[f]))o[f]={...inc[f],...(cur[f]||{})}});o.customFoods=[...(cur.customFoods||[]),...(inc.customFoods||[]).filter(f=>!(cur.customFoods||[]).some(g=>g.id===f.id))];if(!cur.aiPlan&&inc.aiPlan)o.aiPlan=inc.aiPlan;return o}
  return cur;
}
async function importRecords(data){
  let n=0;
  for(const[k,v]of Object.entries(data)){if(v==null||typeof v!=='object')continue;const cur=await load(k);save(k,mergeRecord(k,v,cur));n++}
  S.dayCache={};S.repData=null;await loadProfile();await loadDay();scheduleStreaks();
  return n;
}
// A picture that cannot load shows a quiet placeholder instead of a broken-image icon.
document.addEventListener('error',ev=>{const t=ev.target;if(t&&t.tagName==='IMG'&&!t.classList.contains('broken'))t.classList.add('broken')},true);

/* ---------- boot ---------- */
(async()=>{
  S.profile=Object.assign(blankProfile(),lsGet('profile')||{});rebuildPlans();
  S.day=Object.assign(blankDay(),lsGet(dayKey(S.date))||{});
  render();
  loadPhotos().then(()=>{if(S.tab==='progress'||S.tab==='today')render()});
  await initCloud();
  if(Cloud.ready){await migrateLocal();S.dayCache={};S.repData=null;await loadProfile();await loadDay();render()}
  else{if(Cloud.why==='nohost'&&ghCfg()&&ghCfg().gist){try{await ghFill(await ghRead(await ghApi('/gists/'+ghCfg().gist)))}catch(e){}ghPush()}render()}
  await fillPastDays();
  await computeStreaks();render();
})();

<script>
// Older installs look for APP_VERSION='BUILD' in this file to offer an update: APP_VERSION='f68835d02c'
const BUILD_ID='f68835d02c';
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
async function checkUpdate(){
  try{
    const t=await (await fetch('./index.html?check='+Date.now(),{cache:'no-store'})).text();
    const m=t.match(/BUILD_ID='([0-9a-f]+)'/);
    if(m&&m[1]!==BUILD_ID&&!document.getElementById('upd')){
      const b=document.createElement('button');b.id='upd';b.className='updbar';b.textContent='New version ready · Tap to update';
      b.onclick=async()=>{try{const r=await navigator.serviceWorker.getRegistration();r&&await r.update()}catch(e){}location.reload()};
      document.body.appendChild(b);
    }
  }catch(e){}
}
addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
setTimeout(checkUpdate,2500);
</script>
